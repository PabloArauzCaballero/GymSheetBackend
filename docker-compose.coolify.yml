# Despliegue en Coolify. Cuatro reglas que no se pueden relajar (ver AtlasDashboardsBackend,
# el mismo VPS y el mismo panel):
#
# 1. NUNCA `ports:`. Coolify crea el contenedor nuevo antes de retirar el viejo y un puerto fijo
#    del host da «address already in use» en cada despliegue. Se publica por el proxy.
# 2. NUNCA `env_file:`. Coolify añade el suyo a cada servicio; las variables se pegan en la
#    interfaz de la aplicación (ver .env.example para la lista completa).
# 3. DB_HOST y REDIS_URL deben apuntar al alias interno del recurso de Coolify (Postgres/Redis
#    creados en el mismo proyecto), nunca a una IP ni a `localhost`.
# 4. Hay que activar «Connect To Predefined Network» en la aplicación.
name: gymsheet-backend

services:
  migrate:
    image: gymsheet-backend:coolify
    build:
      context: .
      dockerfile: Dockerfile
      cache_from:
        - gymsheet-backend:coolify
    command: ['node', 'dist/database/migrate.js', 'up']
    restart: 'no'
    networks:
      - default
      - coolify
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  api:
    # Sin `build:`: reutiliza la imagen que construyó `migrate`. Dos builds simultáneos de la
    # misma imagen agotan la memoria del VPS y el despliegue muere sin decir por qué.
    image: gymsheet-backend:coolify
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    init: true
    networks:
      default: {}
      coolify:
        aliases:
          - gymsheet-backend
    expose:
      - '3000'
    cpu_shares: 4096
    stop_grace_period: 20s
    deploy:
      resources:
        limits:
          memory: 768m
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/api/v1/gateway/health >/dev/null 2>&1 || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  default: {}
  coolify:
    external: true
    name: coolify
