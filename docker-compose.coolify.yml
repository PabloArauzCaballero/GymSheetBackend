# Despliegue en Coolify. Postgres y Redis viven EN ESTE MISMO compose (no como recursos aparte
# de Coolify): un volumen nombrado por servicio les da persistencia entre despliegues, y
# `depends_on: condition: service_healthy` bloquea `migrate`/`api` hasta que ambos respondan.
#
# Reglas que no se pueden relajar:
#
# 1. NUNCA `ports:` en `api`. Coolify crea el contenedor nuevo antes de retirar el viejo y un
#    puerto fijo del host da «address already in use» en cada despliegue. Se publica por el
#    proxy. `postgres`/`redis` tampoco publican puerto: solo se hablan por la red `coolify`.
# 2. NUNCA `env_file:`. Coolify añade el suyo a cada servicio SOLO como archivo de interpolación
#    (`--env-file` de `docker compose`), no como entorno del contenedor: una variable únicamente
#    llega al proceso si algún `environment:` de ESTE archivo la referencia con `${VAR}`. Por eso
#    `x-app-environment` de abajo tiene que listar cada variable que el backend necesita —
#    limitarse a las de base de datos (como se hizo en un intento anterior) deja sin
#    `JWT_ACCESS_SECRET`/`WHATSAPP_MEMBERSHIP_PHONE`/etc. al contenedor, que revienta con
#    `exit 1` al arrancar (env.ts rechaza el proceso si falta cualquier variable requerida) sin
#    dejar rastro en el log de despliegue de Coolify, solo en el log del propio contenedor.
# 3. TODAS las variables deben quedar "Runtime only" en Coolify (no "Available at Buildtime"):
#    este backend no necesita nada en build-time, y NODE_ENV=production en build-time hace que
#    yarn se salte devDependencies y `yarn build` truene con exit 127. Con NODE_ENV=development
#    el build sí compila (development no salta devDependencies), pero igual conviene marcarlas
#    Runtime-only: build-time innecesario solo invalida caché de capas en cada cambio de env.
# 4. Hay que activar «Connect To Predefined Network» en la aplicación.
# 5. RAMA `test` (VPS de Contabo): AQUÍ NO HAY SIDECARS DE TAILSCALE. En `dev` (H310) la API se
#    publica con un Funnel porque esa máquina no tiene IP pública; Contabo sí la tiene, así que
#    el origen público lo da el Traefik de Coolify con un dominio `sslip.io`
#    (`docker_compose_domains` de la aplicación). Los servicios `tunnel` y `tunnel-media` están
#    borrados A PROPÓSITO en esta rama, no olvidados: levantarlos aquí reclamaría los MISMOS
#    hostnames de tailnet (`gymsheet-backend`, `gymsheet-media`) que ya usa el despliegue de
#    `dev`, y Tailscale renombra el nodo nuevo — el Funnel de dev dejaría de resolver.
# 6. SOLO `migrate` declara `build:`. `api` y los workers comparten la MISMA imagen
#    (`gymsheet-backend:coolify`) vía `image:` + `pull_policy: never`, nunca su propio `build:`.
#    Patrón confirmado en los repos de Atlas (AtlasBackend, comentario "La imagen se construye UNA
#    VEZ"): darle `build:` a varios servicios que apuntan al mismo tag hace que Compose los
#    construya en PARALELO — varios `yarn install --frozen-lockfile` a la vez, cada uno resolviendo
#    el árbol entero, agotan la memoria del VPS y el OOM killer se lleva a uno; el síntoma es
#    `yarn install ... exit code: 1` sin mención de memoria, y el servicio que muere CAMBIA entre
#    intentos (la firma de una carrera por recursos, no de un fallo real de build). `pull_policy:
#    never` es lo que reemplaza al viejo truco de "build: en todos" para que el pre-pull de Coolify
#    (`docker compose pull --ignore-buildable`) no intente bajar `gymsheet-backend:coolify` de un
#    registro donde nunca existió: `--ignore-buildable` salta a quien declara `build:` (`migrate`);
#    quien solo declara `image:` necesita `pull_policy: never` para no intentar el pull igual.
name: gymsheet-backend

x-app-environment: &app-environment
  NODE_ENV: ${NODE_ENV:-development}
  API_PREFIX: ${API_PREFIX:-api/v1}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
  TRUST_PROXY: ${TRUST_PROXY:-true}
  REQUEST_BODY_LIMIT: ${REQUEST_BODY_LIMIT:-1mb}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  BUSINESS_TIME_ZONE: ${BUSINESS_TIME_ZONE:-America/La_Paz}
  DEFAULT_TENANT_ID: ${DEFAULT_TENANT_ID:-}
  ACCESS_POLICY_VERSION: ${ACCESS_POLICY_VERSION:-2026-07-19}
  ACCESS_MOCK_ENABLED: ${ACCESS_MOCK_ENABLED:-false}
  WHATSAPP_MEMBERSHIP_PHONE: ${WHATSAPP_MEMBERSHIP_PHONE:?WHATSAPP_MEMBERSHIP_PHONE is required}
  METRICS_SCRAPE_TOKEN: ${METRICS_SCRAPE_TOKEN:-}

  # Fijos a los alias internos (con prefijo de proyecto, ver comentario en el servicio `postgres`
  # más abajo) de los servicios `postgres`/`redis` de este mismo stack. Lo que se pegue en Coolify
  # para estas cinco no se usa (interceptadas aquí a propósito).
  DB_HOST: gymsheet-postgres
  DB_PORT: '5432'
  REDIS_URL: redis://gymsheet-redis:6379
  REDIS_REQUIRED: 'true'
  REDIS_CONNECT_TIMEOUT_MS: ${REDIS_CONNECT_TIMEOUT_MS:-5000}

  DB_NAME: ${DB_NAME:?DB_NAME is required}
  DB_USER: ${DB_USER:?DB_USER is required}
  DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
  DB_SSL: ${DB_SSL:-false}
  DB_SSL_REJECT_UNAUTHORIZED: ${DB_SSL_REJECT_UNAUTHORIZED:-true}
  DB_LOGGING: ${DB_LOGGING:-false}
  DB_POOL_MAX: ${DB_POOL_MAX:-10}
  DB_POOL_MIN: ${DB_POOL_MIN:-0}
  DB_POOL_ACQUIRE_MS: ${DB_POOL_ACQUIRE_MS:-30000}
  DB_POOL_IDLE_MS: ${DB_POOL_IDLE_MS:-10000}
  DB_CONNECT_TIMEOUT_MS: ${DB_CONNECT_TIMEOUT_MS:-10000}
  DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS:-15000}

  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
  JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
  JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
  JWT_ISSUER: ${JWT_ISSUER:-gym-sheet-api}
  JWT_AUDIENCE: ${JWT_AUDIENCE:-gym-sheet-web}

  PASSWORD_RESET_PIN_TTL_MINUTES: ${PASSWORD_RESET_PIN_TTL_MINUTES:-10}
  PASSWORD_RESET_MAX_ATTEMPTS: ${PASSWORD_RESET_MAX_ATTEMPTS:-5}

  BCRYPT_SALT_ROUNDS: ${BCRYPT_SALT_ROUNDS:-12}
  RATE_LIMIT_TTL_SECONDS: ${RATE_LIMIT_TTL_SECONDS:-60}
  RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-100}
  AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-10}
  PUBLIC_RATE_LIMIT_MAX: ${PUBLIC_RATE_LIMIT_MAX:-60}
  GATEWAY_ENABLED: ${GATEWAY_ENABLED:-true}

  WORKER_POLL_INTERVAL_MS: ${WORKER_POLL_INTERVAL_MS:-1000}
  WORKER_BATCH_SIZE: ${WORKER_BATCH_SIZE:-50}
  WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-5}
  WORKER_LOCK_TIMEOUT_MS: ${WORKER_LOCK_TIMEOUT_MS:-300000}
  WORKER_MAX_ATTEMPTS: ${WORKER_MAX_ATTEMPTS:-5}
  OUTBOX_RETENTION_DAYS: ${OUTBOX_RETENTION_DAYS:-30}
  OUTBOX_PRUNE_BATCH_SIZE: ${OUTBOX_PRUNE_BATCH_SIZE:-1000}
  REMINDER_SCAN_INTERVAL_MS: ${REMINDER_SCAN_INTERVAL_MS:-3600000}
  STORIES_PURGE_INTERVAL_MS: ${STORIES_PURGE_INTERVAL_MS:-3600000}
  STORIES_PURGE_BATCH_SIZE: ${STORIES_PURGE_BATCH_SIZE:-200}
  NOTIFICATION_DELIVERY_PROVIDER: ${NOTIFICATION_DELIVERY_PROVIDER:-IN_APP}
  NOTIFICATION_GATEWAY_URL: ${NOTIFICATION_GATEWAY_URL:-}
  NOTIFICATION_GATEWAY_SECRET: ${NOTIFICATION_GATEWAY_SECRET:-}
  NOTIFICATION_GATEWAY_ALLOWED_HOSTS: ${NOTIFICATION_GATEWAY_ALLOWED_HOSTS:-}
  NOTIFICATION_GATEWAY_TIMEOUT_MS: ${NOTIFICATION_GATEWAY_TIMEOUT_MS:-10000}

  # Push al navegador (ADR-0011). Independiente de Expo: el móvil no necesita
  # configuración aquí porque sus credenciales viven en el proyecto de EAS. El
  # par VAPID se genera una vez por despliegue y se pega en las variables de
  # Coolify; rotarlo invalida todas las suscripciones existentes. Con
  # WEB_PUSH_TRANSPORT=VAPID y sin claves el contenedor NO arranca (a propósito).
  WEB_PUSH_TRANSPORT: ${WEB_PUSH_TRANSPORT:-DISABLED}
  VAPID_SUBJECT: ${VAPID_SUBJECT:-}
  VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
  VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
  WEB_PUSH_ALLOWED_HOSTS: '${WEB_PUSH_ALLOWED_HOSTS:-fcm.googleapis.com,updates.push.services.mozilla.com,web.push.apple.com}'
  WEB_PUSH_TIMEOUT_MS: ${WEB_PUSH_TIMEOUT_MS:-10000}
  WEB_PUSH_TTL_SECONDS: ${WEB_PUSH_TTL_SECONDS:-86400}

  MAIL_TRANSPORT: ${MAIL_TRANSPORT:-LOG}
  MAIL_FROM: ${MAIL_FROM:-}
  MAIL_SMTP_HOST: ${MAIL_SMTP_HOST:-}
  MAIL_SMTP_PORT: ${MAIL_SMTP_PORT:-587}
  MAIL_SMTP_USER: ${MAIL_SMTP_USER:-}
  MAIL_SMTP_PASSWORD: ${MAIL_SMTP_PASSWORD:-}
  MAIL_SMTP_TIMEOUT_MS: ${MAIL_SMTP_TIMEOUT_MS:-10000}
  GMAIL_CLIENT_ID: ${GMAIL_CLIENT_ID:-}
  GMAIL_CLIENT_SECRET: ${GMAIL_CLIENT_SECRET:-}
  GMAIL_REFRESH_TOKEN: ${GMAIL_REFRESH_TOKEN:-}
  GMAIL_FROM_EMAIL: ${GMAIL_FROM_EMAIL:-}

  PORTAL_PUBLIC_URL: ${PORTAL_PUBLIC_URL:-http://localhost:3001}
  ACTIVATION_LINK_TTL_HOURS: ${ACTIVATION_LINK_TTL_HOURS:-48}

  EXERCISES_DATASET_ENABLED: ${EXERCISES_DATASET_ENABLED:-false}
  EXERCISES_DATASET_JSON_URL: ${EXERCISES_DATASET_JSON_URL:-https://raw.githubusercontent.com/hasaneyldrm/exercises-dataset/main/data/exercises.json}
  EXERCISES_DATASET_ALLOWED_HOSTS: ${EXERCISES_DATASET_ALLOWED_HOSTS:-raw.githubusercontent.com}
  EXERCISES_DATASET_TIMEOUT_MS: ${EXERCISES_DATASET_TIMEOUT_MS:-15000}
  EXERCISES_DATASET_MAX_RESPONSE_BYTES: ${EXERCISES_DATASET_MAX_RESPONSE_BYTES:-25000000}
  EXERCISES_DATASET_BATCH_SIZE: ${EXERCISES_DATASET_BATCH_SIZE:-100}
  EXERCISES_DATASET_MIN_RECORDS: ${EXERCISES_DATASET_MIN_RECORDS:-1000}
  EXERCISES_DATASET_REFRESH_INTERVAL_MS: ${EXERCISES_DATASET_REFRESH_INTERVAL_MS:-86400000}
  EXERCISES_DATASET_REFRESH_RETRY_MS: ${EXERCISES_DATASET_REFRESH_RETRY_MS:-3600000}
  EXERCISES_DATASET_IMPORT_MEDIA: ${EXERCISES_DATASET_IMPORT_MEDIA:-false}
  EXERCISES_DATASET_MEDIA_LICENSE_CONFIRMED: ${EXERCISES_DATASET_MEDIA_LICENSE_CONFIRMED:-false}
  EXERCISES_OPEN_MEDIA_ENABLED: ${EXERCISES_OPEN_MEDIA_ENABLED:-true}
  EXERCISES_OPEN_MEDIA_JSON_URL: ${EXERCISES_OPEN_MEDIA_JSON_URL:-https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/dist/exercises.json}
  EXERCISES_OPEN_MEDIA_BASE_URL: ${EXERCISES_OPEN_MEDIA_BASE_URL:-https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/}
  CANONICAL_EXERCISES_SOURCE: ${CANONICAL_EXERCISES_SOURCE:-seeders}

  SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
  SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
  SEED_ADMIN_FULL_NAME: ${SEED_ADMIN_FULL_NAME:-GymSheet Administrator}
  SEED_MOCK_PASSWORD: ${SEED_MOCK_PASSWORD:-}

  MEDIA_STORAGE_PROVIDER: ${MEDIA_STORAGE_PROVIDER:-local}
  MEDIA_STORAGE_LOCAL_ROOT: ${MEDIA_STORAGE_LOCAL_ROOT:-storage/media}
  MEDIA_STORAGE_PUBLIC_BASE_URL: ${MEDIA_STORAGE_PUBLIC_BASE_URL:-http://localhost:3000/media}
  MEDIA_UPLOAD_MAX_BYTES: ${MEDIA_UPLOAD_MAX_BYTES:-5242880}
  MEDIA_ALLOWED_MIME: ${MEDIA_ALLOWED_MIME:-image/jpeg,image/png,image/webp,image/gif}
  # Faltaban: el contenedor corría con los defaults de env.ts y cualquier ajuste
  # pegado en Coolify no llegaba al proceso (ver regla 2 arriba).
  CHAT_MEDIA_MAX_BYTES: ${CHAT_MEDIA_MAX_BYTES:-26214400}
  CHAT_MEDIA_ALLOWED_MIME: '${CHAT_MEDIA_ALLOWED_MIME:-image/jpeg,image/png,image/webp,image/gif,video/mp4,video/quicktime}'
  MEDIA_MIRROR_ALLOWED_HOSTS: ${MEDIA_MIRROR_ALLOWED_HOSTS:-images.unsplash.com,raw.githubusercontent.com}
  MEDIA_MIRROR_TIMEOUT_MS: ${MEDIA_MIRROR_TIMEOUT_MS:-15000}

  # Almacén de media inmutable (ADR-0010). `MINIO_ENDPOINT` es el alias INTERNO
  # del servicio de abajo: por ahí escribe la API. Por dónde LEEN los navegadores
  # es otra cosa — `MEDIA_STORAGE_PUBLIC_BASE_URL`, que apunta al Funnel.
  # Las credenciales sólo se exigen con MEDIA_STORAGE_PROVIDER=minio, y quien lo
  # comprueba es el factory al arrancar (sin fallback silencioso).
  MINIO_ENDPOINT: ${MINIO_ENDPOINT:-gymsheet-minio}
  MINIO_PORT: ${MINIO_PORT:-9000}
  MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-}
  MINIO_BUCKET: ${MINIO_BUCKET:-gymsheet-media}
  MINIO_REGION: ${MINIO_REGION:-us-east-1}
  CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
  CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
  CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
  CLOUDINARY_FOLDER: ${CLOUDINARY_FOLDER:-gymsheet}

# Sin `build:` — reutilizan la imagen que construye `migrate` (ver regla 6 arriba: darle `build:`
# a varios servicios del mismo tag los hace construir en PARALELO y compite por memoria). Sin
# `expose:` ni healthcheck: no escuchan en ningún puerto, así que lo único que Docker puede vigilar
# de ellos es que el proceso siga vivo (`restart: unless-stopped`).
x-worker-service: &worker-service
  image: gymsheet-backend:coolify
  pull_policy: never
  profiles: ['workers']
  environment:
    <<: *app-environment
  volumes:
    # `worker-stories-purge` borra binarios de stories caducadas. Sin este
    # volumen veía un /app/storage/media vacío: la fila caía pero el fichero
    # quedaba huérfano en el volumen de `api`, sin error y sin rastro. Con
    # MEDIA_STORAGE_PROVIDER=minio el borrado ya no ocurre nunca (ADR-0010) y
    # el montaje es inocuo, pero mientras exista el proveedor local tiene que
    # ver exactamente el mismo disco que la API.
    - media-data:/app/storage/media
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully
  restart: unless-stopped
  init: true
  networks:
    - default
    - coolify
  stop_grace_period: 20s
  deploy:
    resources:
      limits:
        memory: 320m
  logging:
    driver: json-file
    options:
      max-size: '10m'
      max-file: '3'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:?DB_NAME is required}
      POSTGRES_USER: ${DB_USER:?DB_USER is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # Alias explícito y con prefijo de proyecto en las dos redes, NO el nombre genérico del
    # servicio. `coolify` es una red COMPARTIDA por todas las apps del VPS: sin alias explícito,
    # Compose usa el nombre del servicio ("postgres") como alias por defecto ahí, y CUALQUIER
    # otro proyecto que también tenga un servicio "postgres" en esa misma red compartida colisiona
    # con el nuestro. Se vio en producción: `api` resolvía "postgres" a una IP que no era la de
    # nuestro contenedor (mismo síntoma con "redis": NOAUTH Authentication required, porque el
    # Redis de otro proyecto SÍ tiene contraseña y el nuestro no). El contenedor de un proyecto
    # está unido a las dos redes (`default` y `coolify`) y la resolución DNS de Docker busca en
    # TODAS las redes a las que está unido, así que ambigüedad en cualquiera de las dos alcanza.
    networks:
      default:
        aliases: [gymsheet-postgres]
      coolify:
        aliases: [gymsheet-postgres]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    deploy:
      resources:
        limits:
          memory: 512m

  redis:
    image: redis:7-alpine
    # Sin persistencia: solo guarda contadores de rate-limit, seguros de perder y baratos de
    # reconstruir.
    command:
      [
        'redis-server',
        '--save',
        '',
        '--appendonly',
        'no',
        '--maxmemory',
        '256mb',
        '--maxmemory-policy',
        'allkeys-lru',
      ]
    # Ver el comentario de `postgres` arriba: alias con prefijo de proyecto en ambas redes, nunca
    # el nombre genérico del servicio en la red compartida `coolify`.
    networks:
      default:
        aliases: [gymsheet-redis]
      coolify:
        aliases: [gymsheet-redis]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    deploy:
      resources:
        limits:
          memory: 256m

  migrate:
    image: gymsheet-backend:coolify
    build:
      context: .
      dockerfile: Dockerfile
      # NUNCA `cache_from`: en este VPS no hay registro, así que apuntar `cache_from` al propio tag
      # falla siempre con "pull access denied" y solo ensucia el log — la caché que de verdad se usa
      # es la del propio BuildKit del daemon, automática, sin declarar nada.
    command: ['node', 'dist/database/migrate.js', 'up']
    environment:
      <<: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'
    # `init: true` es tini (Docker lo trae incorporado) como PID 1. Sin él, un SIGTERM a mitad de
    # migración (Coolify cancelando un despliegue, por ejemplo) no le llega a Node y el contenedor
    # termina en SIGKILL forzado tras el grace period, en vez de un cierre ordenado. La migración
    # corre en transacción (ver migrateUp en src/database/migrate.ts), así que Postgres revierte
    # igual ante un kill; esto solo evita el kill innecesario.
    init: true
    networks:
      - default
      - coolify
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  api:
    # Sin `build:` (ver regla 6 arriba): reutiliza la imagen que construyó `migrate`.
    # `pull_policy: never` es lo que le dice al pre-pull de Coolify que no intente bajarla de un
    # registro inexistente, sin caer en la trampa de reconstruir en paralelo.
    image: gymsheet-backend:coolify
    pull_policy: never
    environment:
      <<: *app-environment
      PORT: '3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    init: true
    networks:
      default: {}
      coolify:
        aliases:
          - gymsheet-backend
    expose:
      - '3000'
    volumes:
      # MEDIA_STORAGE_PROVIDER=local escribe aquí. Sin este volumen cada despliegue estrena
      # contenedor y las imágenes subidas desaparecen sin error: la fila en base de datos
      # sobrevive y la URL devuelve 404. El Dockerfile crea /app/storage/media como `node`
      # para que el volumen herede esa propiedad al crearse.
      - media-data:/app/storage/media
    cpu_shares: 4096
    stop_grace_period: 20s
    deploy:
      resources:
        limits:
          memory: 768m
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/api/v1/gateway/health >/dev/null 2>&1 || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ---------------------------------------------------------------------------
  # Almacén de media inmutable (ADR-0010). Sustituye al volumen `media-data`
  # como destino de lo que suben los socios: fotos de perfil, stories y
  # adjuntos de chat, ordenados por usuario en
  # `users/<userId>/<categoria>/<sha256>.<ext>`.
  #
  # Sin `ports:` como el resto del stack: la API le habla por el alias interno
  # `minio` y el mundo entra por el dominio `sslip.io` que Traefik enruta a este servicio.
  #
  # `api` NO declara `depends_on` sobre estos servicios a propósito: si el
  # almacén tiene un mal día,
  # la API tiene que seguir sirviendo entrenamientos, membresías y chat de
  # texto. Lo que no puede pasar es que arranque a medio configurar, y de eso se
  # encarga el factory, que detiene el proceso si falta una credencial.
  #
  # ## Apagados por defecto (perfil `media`)
  #
  # Como los workers. Para encenderlos hay que poner en Coolify las credenciales
  # de abajo y añadir `media` a COMPOSE_PROFILES:
  #
  #     COMPOSE_PROFILES=media            (o `workers,media` si también van esos)
  #
  # Y OJO con la trampa que hay detrás de que las credenciales usen `:-` y no
  # `:?`: Compose interpola el fichero ENTERO **antes** de aplicar los perfiles,
  # así que un `${VAR:?}` aquí abajo rompe el despliegue completo aunque este
  # servicio no se vaya a levantar. Verificado, no supuesto. Por eso el guardia
  # de credenciales es la comprobación de shell del `command`: falla el
  # contenedor, con un mensaje legible, en vez de tumbar el despliegue de la API
  # — y sobre todo, evita que MinIO arranque con el minioadmin/minioadmin por
  # defecto, que con el Funnel delante sería root abierto al mundo.
  # ---------------------------------------------------------------------------
  minio:
    # quay.io, NO Docker Hub: `minio/minio` ya no se puede bajar de Docker Hub
    # («pull access denied … repository does not exist»), y eso tumbó un
    # despliegue entero porque Coolify hace `docker compose pull` de todo antes
    # de levantar nada. Comprobado en este VPS: redis:7-alpine baja sin
    # problema, minio/minio no, quay.io/minio/minio sí. Es además el registro
    # que ya usa el stack de Atlas en esta misma máquina.
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    profiles: ['media']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
    entrypoint: ['/bin/sh', '-c']
    # `$$` porque Compose interpola `$` antes de que lo vea la shell del contenedor.
    command:
      - |
        set -eu
        : "$${MINIO_ROOT_USER:?falta MINIO_ROOT_USER en las variables de Coolify}"
        : "$${MINIO_ROOT_PASSWORD:?falta MINIO_ROOT_PASSWORD en las variables de Coolify}"
        exec minio server /data --console-address :9001
    volumes:
      - minio-data:/data
    restart: unless-stopped
    # Alias con prefijo de proyecto, por lo mismo que `postgres`/`redis` (ver su
    # comentario arriba): `minio` es un nombre genérico y la red `coolify` la
    # comparten TODAS las apps del VPS — hay otros dos proyectos con su propio
    # servicio `minio` ahí. Visto en producción al levantar esto: el Funnel
    # resolvía `minio` al almacén de otro proyecto y devolvía AccessDenied para
    # una ruta que en el nuestro era pública. Nadie debe usar `minio` a secas
    # como hostname.
    networks:
      default:
        aliases: [gymsheet-minio]
      coolify:
        aliases: [gymsheet-minio]
    expose:
      - '9000'
    stop_grace_period: 20s
    deploy:
      resources:
        limits:
          memory: 512m
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Una pasada al desplegar, como `migrate`: crea el bucket, activa el
  # versionado y deja al usuario de la API SIN permiso de borrado. Reutiliza la
  # imagen del servidor —que ya trae `mc`— para no bajar una segunda.
  #
  # Idempotente: se ejecuta entero en cada despliegue y converge al mismo
  # estado. Es además el sitio donde vive la garantía de "no se borra nunca":
  # el no-op del adaptador es código y alguien puede quitarlo; esto es el
  # servidor diciendo que no.
  minio-init:
    # quay.io, NO Docker Hub: `minio/minio` ya no se puede bajar de Docker Hub
    # («pull access denied … repository does not exist»), y eso tumbó un
    # despliegue entero porque Coolify hace `docker compose pull` de todo antes
    # de levantar nada. Comprobado en este VPS: redis:7-alpine baja sin
    # problema, minio/minio no, quay.io/minio/minio sí. Es además el registro
    # que ya usa el stack de Atlas en esta misma máquina.
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    profiles: ['media']
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-}
      MINIO_BUCKET: ${MINIO_BUCKET:-gymsheet-media}
    entrypoint: ['/bin/sh', '-c']
    # `$$` porque Compose interpola `$` antes de que lo vea la shell del contenedor.
    command:
      - |
        set -eu
        : "$${MINIO_ACCESS_KEY:?falta MINIO_ACCESS_KEY en las variables de Coolify}"
        : "$${MINIO_SECRET_KEY:?falta MINIO_SECRET_KEY en las variables de Coolify}"
        mc alias set gs "http://gymsheet-minio:9000" "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"

        mc mb --ignore-existing gs/"$$MINIO_BUCKET"
        # Versionado: una sobrescritura nunca destruye la versión previa.
        mc version enable gs/"$$MINIO_BUCKET"

        # Política del usuario de la API: escribir y leer, NUNCA borrar. Sin
        # s3:DeleteObject ni s3:DeleteObjectVersion, a propósito.
        cat > /tmp/app-policy.json <<JSON
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Action": ["s3:PutObject", "s3:GetObject"],
              "Resource": ["arn:aws:s3:::$$MINIO_BUCKET/*"]
            },
            {
              "Effect": "Allow",
              "Action": ["s3:ListBucket"],
              "Resource": ["arn:aws:s3:::$$MINIO_BUCKET"]
            }
          ]
        }
        JSON

        mc admin user info gs "$$MINIO_ACCESS_KEY" >/dev/null 2>&1 \
          || mc admin user add gs "$$MINIO_ACCESS_KEY" "$$MINIO_SECRET_KEY"
        mc admin policy create gs gymsheet-api /tmp/app-policy.json \
          || mc admin policy add gs gymsheet-api /tmp/app-policy.json
        mc admin policy attach gs gymsheet-api --user "$$MINIO_ACCESS_KEY" 2>/dev/null || true

        # Lectura anónima por prefijo. `perfiles` es público por diseño (el
        # directorio del gimnasio lo consumen navegadores sin sesión); el resto
        # conserva el modelo que ya tenía el adaptador local, donde
        # express.static servía todo el directorio. Se apoya en que la clave es
        # el SHA-256 del contenido, así que la URL no se adivina — y por eso
        # NO se concede s3:ListBucket anónimo: sin listado, no hay enumeración.
        cat > /tmp/bucket-policy.json <<JSON
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Principal": {"AWS": ["*"]},
              "Action": ["s3:GetObject"],
              "Resource": [
                "arn:aws:s3:::$$MINIO_BUCKET/users/*/perfiles/*",
                "arn:aws:s3:::$$MINIO_BUCKET/users/*/stories/*",
                "arn:aws:s3:::$$MINIO_BUCKET/users/*/publicaciones/*",
                "arn:aws:s3:::$$MINIO_BUCKET/users/*/chats/*",
                "arn:aws:s3:::$$MINIO_BUCKET/catalog/*"
              ]
            }
          ]
        }
        JSON
        mc anonymous set-json /tmp/bucket-policy.json gs/"$$MINIO_BUCKET"

        echo "minio-init: bucket $$MINIO_BUCKET listo (versionado on, usuario de API sin borrado)"
    restart: 'no'
    init: true
    networks:
      - default
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  # ---------------------------------------------------------------------------
  # Workers. Apagados por defecto: cada uno es un proceso Node completo (~200 MB
  # con el runtime de Nest dentro) y encenderlos los cinco a ciegas puede dejar
  # sin memoria al VPS y tumbar el despliegue de la API, que es lo que de verdad
  # no puede caerse. Para encenderlos, añadir en las variables de la aplicación
  # en Coolify:
  #
  #     COMPOSE_PROFILES=workers
  #
  # y redesplegar. Docker Compose lee COMPOSE_PROFILES del archivo de entorno que
  # Coolify pasa con --env-file, igual que el resto de variables. Si por lo que
  # sea no lo leyera, el fallo es benigno: los workers no arrancan y todo lo
  # demás queda exactamente como hoy.
  #
  # Reparto de responsabilidades (docs/workers/notification-workers.md):
  #   access-event        → drena la bandeja de eventos de acceso física
  #   membership-reminder → avisos de vencimiento de membresía
  #   notification-delivery → entrega lo que el outbox transaccional deja listo
  #   stories-purge       → borra stories caducadas
  #   exercises-dataset-refresh → refresco del dataset externo de ejercicios;
  #     solo hace trabajo real con EXERCISES_DATASET_ENABLED=true.
  # ---------------------------------------------------------------------------

  worker-access-event:
    <<: *worker-service
    command: ['node', 'dist/workers/access-event.worker.js']

  worker-membership-reminder:
    <<: *worker-service
    command: ['node', 'dist/workers/membership-reminder.worker.js']

  worker-notification-delivery:
    <<: *worker-service
    command: ['node', 'dist/workers/notification-delivery.worker.js']

  worker-stories-purge:
    <<: *worker-service
    command: ['node', 'dist/workers/stories-purge.worker.js']

  worker-exercises-dataset-refresh:
    <<: *worker-service
    command: ['node', 'dist/workers/exercises-dataset-refresh.worker.js']

volumes:
  postgres-data:
  # Media del proveedor `local`. Se conserva aunque el stack ya use MinIO: es el
  # respaldo de lo que hubiera antes de la conmutación, y borrarlo sería
  # exactamente lo que este cambio promete que no pasa.
  media-data:
  minio-data:

networks:
  default: {}
  coolify:
    external: true
    name: coolify
