# Despliegue en Coolify. Postgres y Redis viven EN ESTE MISMO compose (no como recursos aparte
# de Coolify): un volumen nombrado por servicio les da persistencia entre despliegues, y
# `depends_on: condition: service_healthy` bloquea `migrate`/`api` hasta que ambos respondan.
#
# Reglas que no se pueden relajar:
#
# 1. NUNCA `ports:` en `api`. Coolify crea el contenedor nuevo antes de retirar el viejo y un
#    puerto fijo del host da «address already in use» en cada despliegue. Se publica por el
#    proxy. `postgres`/`redis` tampoco publican puerto: solo se hablan por la red `coolify`.
# 2. NUNCA `env_file:`. Coolify añade el suyo a cada servicio SOLO como archivo de interpolación
#    (`--env-file` de `docker compose`), no como entorno del contenedor: una variable únicamente
#    llega al proceso si algún `environment:` de ESTE archivo la referencia con `${VAR}`. Por eso
#    `x-app-environment` de abajo tiene que listar cada variable que el backend necesita —
#    limitarse a las de base de datos (como se hizo en un intento anterior) deja sin
#    `JWT_ACCESS_SECRET`/`WHATSAPP_MEMBERSHIP_PHONE`/etc. al contenedor, que revienta con
#    `exit 1` al arrancar (env.ts rechaza el proceso si falta cualquier variable requerida) sin
#    dejar rastro en el log de despliegue de Coolify, solo en el log del propio contenedor.
# 3. TODAS las variables deben quedar "Runtime only" en Coolify (no "Available at Buildtime"):
#    este backend no necesita nada en build-time, y NODE_ENV=production en build-time hace que
#    yarn se salte devDependencies y `yarn build` truene con exit 127. Con NODE_ENV=development
#    el build sí compila (development no salta devDependencies), pero igual conviene marcarlas
#    Runtime-only: build-time innecesario solo invalida caché de capas en cada cambio de env.
# 4. Hay que activar «Connect To Predefined Network» en la aplicación.
# 5. El servicio `tunnel` da a esta API un origen público real (Tailscale Funnel, acceso anónimo,
#    sin VPN) para que el frontend use en `BACKEND_PUBLIC_ORIGIN`: el navegador del usuario NO
#    está en la red `coolify`, así que el alias interno `gymsheet-backend:3000` no le sirve para
#    abrir el socket de chat directo. Requiere el secret `TS_AUTHKEY` en Coolify (mismo valor que
#    en GymSheetFrontend sirve — no es exclusivo de un repo). Con `:-` en vez de `:?`: sin la key
#    puesta, solo `tunnel` falla, `api` sigue sirviendo normal (ver GymSheetFrontend para el
#    incidente real de por qué NO se usa `:?` aquí).
name: gymsheet-backend

x-app-environment: &app-environment
  NODE_ENV: ${NODE_ENV:-development}
  API_PREFIX: ${API_PREFIX:-api/v1}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
  TRUST_PROXY: ${TRUST_PROXY:-true}
  REQUEST_BODY_LIMIT: ${REQUEST_BODY_LIMIT:-1mb}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  BUSINESS_TIME_ZONE: ${BUSINESS_TIME_ZONE:-America/La_Paz}
  DEFAULT_TENANT_ID: ${DEFAULT_TENANT_ID:-}
  ACCESS_POLICY_VERSION: ${ACCESS_POLICY_VERSION:-2026-07-19}
  ACCESS_MOCK_ENABLED: ${ACCESS_MOCK_ENABLED:-false}
  WHATSAPP_MEMBERSHIP_PHONE: ${WHATSAPP_MEMBERSHIP_PHONE:?WHATSAPP_MEMBERSHIP_PHONE is required}
  METRICS_SCRAPE_TOKEN: ${METRICS_SCRAPE_TOKEN:-}

  # Fijos a los alias internos de los servicios `postgres`/`redis` de este mismo stack. Lo que
  # se pegue en Coolify para estas cinco no se usa (interceptadas aquí a propósito).
  DB_HOST: postgres
  DB_PORT: '5432'
  REDIS_URL: redis://redis:6379
  REDIS_REQUIRED: 'true'
  REDIS_CONNECT_TIMEOUT_MS: ${REDIS_CONNECT_TIMEOUT_MS:-5000}

  DB_NAME: ${DB_NAME:?DB_NAME is required}
  DB_USER: ${DB_USER:?DB_USER is required}
  DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
  DB_SSL: ${DB_SSL:-false}
  DB_SSL_REJECT_UNAUTHORIZED: ${DB_SSL_REJECT_UNAUTHORIZED:-true}
  DB_LOGGING: ${DB_LOGGING:-false}
  DB_POOL_MAX: ${DB_POOL_MAX:-10}
  DB_POOL_MIN: ${DB_POOL_MIN:-0}
  DB_POOL_ACQUIRE_MS: ${DB_POOL_ACQUIRE_MS:-30000}
  DB_POOL_IDLE_MS: ${DB_POOL_IDLE_MS:-10000}
  DB_CONNECT_TIMEOUT_MS: ${DB_CONNECT_TIMEOUT_MS:-10000}
  DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS:-15000}

  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
  JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
  JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
  JWT_ISSUER: ${JWT_ISSUER:-gym-sheet-api}
  JWT_AUDIENCE: ${JWT_AUDIENCE:-gym-sheet-web}

  PASSWORD_RESET_PIN_TTL_MINUTES: ${PASSWORD_RESET_PIN_TTL_MINUTES:-10}
  PASSWORD_RESET_MAX_ATTEMPTS: ${PASSWORD_RESET_MAX_ATTEMPTS:-5}

  BCRYPT_SALT_ROUNDS: ${BCRYPT_SALT_ROUNDS:-12}
  RATE_LIMIT_TTL_SECONDS: ${RATE_LIMIT_TTL_SECONDS:-60}
  RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-100}
  AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-10}
  PUBLIC_RATE_LIMIT_MAX: ${PUBLIC_RATE_LIMIT_MAX:-60}
  GATEWAY_ENABLED: ${GATEWAY_ENABLED:-true}

  WORKER_POLL_INTERVAL_MS: ${WORKER_POLL_INTERVAL_MS:-1000}
  WORKER_BATCH_SIZE: ${WORKER_BATCH_SIZE:-50}
  WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-5}
  WORKER_LOCK_TIMEOUT_MS: ${WORKER_LOCK_TIMEOUT_MS:-300000}
  WORKER_MAX_ATTEMPTS: ${WORKER_MAX_ATTEMPTS:-5}
  OUTBOX_RETENTION_DAYS: ${OUTBOX_RETENTION_DAYS:-30}
  OUTBOX_PRUNE_BATCH_SIZE: ${OUTBOX_PRUNE_BATCH_SIZE:-1000}
  REMINDER_SCAN_INTERVAL_MS: ${REMINDER_SCAN_INTERVAL_MS:-3600000}
  STORIES_PURGE_INTERVAL_MS: ${STORIES_PURGE_INTERVAL_MS:-3600000}
  STORIES_PURGE_BATCH_SIZE: ${STORIES_PURGE_BATCH_SIZE:-200}
  NOTIFICATION_DELIVERY_PROVIDER: ${NOTIFICATION_DELIVERY_PROVIDER:-IN_APP}
  NOTIFICATION_GATEWAY_URL: ${NOTIFICATION_GATEWAY_URL:-}
  NOTIFICATION_GATEWAY_SECRET: ${NOTIFICATION_GATEWAY_SECRET:-}
  NOTIFICATION_GATEWAY_ALLOWED_HOSTS: ${NOTIFICATION_GATEWAY_ALLOWED_HOSTS:-}
  NOTIFICATION_GATEWAY_TIMEOUT_MS: ${NOTIFICATION_GATEWAY_TIMEOUT_MS:-10000}

  MAIL_TRANSPORT: ${MAIL_TRANSPORT:-LOG}
  MAIL_FROM: ${MAIL_FROM:-}
  MAIL_SMTP_HOST: ${MAIL_SMTP_HOST:-}
  MAIL_SMTP_PORT: ${MAIL_SMTP_PORT:-587}
  MAIL_SMTP_USER: ${MAIL_SMTP_USER:-}
  MAIL_SMTP_PASSWORD: ${MAIL_SMTP_PASSWORD:-}
  MAIL_SMTP_TIMEOUT_MS: ${MAIL_SMTP_TIMEOUT_MS:-10000}
  GMAIL_CLIENT_ID: ${GMAIL_CLIENT_ID:-}
  GMAIL_CLIENT_SECRET: ${GMAIL_CLIENT_SECRET:-}
  GMAIL_REFRESH_TOKEN: ${GMAIL_REFRESH_TOKEN:-}
  GMAIL_FROM_EMAIL: ${GMAIL_FROM_EMAIL:-}

  PORTAL_PUBLIC_URL: ${PORTAL_PUBLIC_URL:-http://localhost:3001}
  ACTIVATION_LINK_TTL_HOURS: ${ACTIVATION_LINK_TTL_HOURS:-48}

  EXERCISES_DATASET_ENABLED: ${EXERCISES_DATASET_ENABLED:-false}
  EXERCISES_DATASET_JSON_URL: ${EXERCISES_DATASET_JSON_URL:-https://raw.githubusercontent.com/hasaneyldrm/exercises-dataset/main/data/exercises.json}
  EXERCISES_DATASET_ALLOWED_HOSTS: ${EXERCISES_DATASET_ALLOWED_HOSTS:-raw.githubusercontent.com}
  EXERCISES_DATASET_TIMEOUT_MS: ${EXERCISES_DATASET_TIMEOUT_MS:-15000}
  EXERCISES_DATASET_MAX_RESPONSE_BYTES: ${EXERCISES_DATASET_MAX_RESPONSE_BYTES:-25000000}
  EXERCISES_DATASET_BATCH_SIZE: ${EXERCISES_DATASET_BATCH_SIZE:-100}
  EXERCISES_DATASET_MIN_RECORDS: ${EXERCISES_DATASET_MIN_RECORDS:-1000}
  EXERCISES_DATASET_REFRESH_INTERVAL_MS: ${EXERCISES_DATASET_REFRESH_INTERVAL_MS:-86400000}
  EXERCISES_DATASET_REFRESH_RETRY_MS: ${EXERCISES_DATASET_REFRESH_RETRY_MS:-3600000}
  EXERCISES_DATASET_IMPORT_MEDIA: ${EXERCISES_DATASET_IMPORT_MEDIA:-false}
  EXERCISES_DATASET_MEDIA_LICENSE_CONFIRMED: ${EXERCISES_DATASET_MEDIA_LICENSE_CONFIRMED:-false}
  EXERCISES_OPEN_MEDIA_ENABLED: ${EXERCISES_OPEN_MEDIA_ENABLED:-true}
  EXERCISES_OPEN_MEDIA_JSON_URL: ${EXERCISES_OPEN_MEDIA_JSON_URL:-https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/dist/exercises.json}
  EXERCISES_OPEN_MEDIA_BASE_URL: ${EXERCISES_OPEN_MEDIA_BASE_URL:-https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/}
  CANONICAL_EXERCISES_SOURCE: ${CANONICAL_EXERCISES_SOURCE:-seeders}

  SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
  SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
  SEED_ADMIN_FULL_NAME: ${SEED_ADMIN_FULL_NAME:-GymSheet Administrator}
  SEED_MOCK_PASSWORD: ${SEED_MOCK_PASSWORD:-}

  MEDIA_STORAGE_PROVIDER: ${MEDIA_STORAGE_PROVIDER:-local}
  MEDIA_STORAGE_LOCAL_ROOT: ${MEDIA_STORAGE_LOCAL_ROOT:-storage/media}
  MEDIA_STORAGE_PUBLIC_BASE_URL: ${MEDIA_STORAGE_PUBLIC_BASE_URL:-http://localhost:3000/media}
  MEDIA_UPLOAD_MAX_BYTES: ${MEDIA_UPLOAD_MAX_BYTES:-5242880}
  MEDIA_ALLOWED_MIME: ${MEDIA_ALLOWED_MIME:-image/jpeg,image/png,image/webp,image/gif}
  MEDIA_MIRROR_ALLOWED_HOSTS: ${MEDIA_MIRROR_ALLOWED_HOSTS:-images.unsplash.com,raw.githubusercontent.com}
  MEDIA_MIRROR_TIMEOUT_MS: ${MEDIA_MIRROR_TIMEOUT_MS:-15000}
  CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
  CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
  CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
  CLOUDINARY_FOLDER: ${CLOUDINARY_FOLDER:-gymsheet}

# Todo lo que comparten los cinco workers. Sin `build:` — reutilizan la imagen que construye
# `migrate`, igual que `api`. Sin `expose:` ni healthcheck: no escuchan en ningún puerto, así que
# lo único que Docker puede vigilar de ellos es que el proceso siga vivo (`restart: unless-stopped`).
x-app-build: &app-build
  context: .
  dockerfile: Dockerfile
  cache_from:
    - gymsheet-backend:coolify

x-worker-service: &worker-service
  image: gymsheet-backend:coolify
  # Repetir `build:` en cada servicio es lo que evita que Coolify intente hacer
  # `docker pull gymsheet-backend:coolify` de un registro donde esa imagen nunca
  # existió: `docker compose ... pull --ignore-buildable` solo se salta el pull
  # de un servicio si ESE servicio trae su propio bloque `build:`, no le basta
  # con que otro servicio del mismo compose construya la misma imagen. Con
  # `cache_from` apuntando al mismo tag, BuildKit reutiliza las capas que ya
  # construyó `migrate` y este build repetido tarda segundos, no minutos.
  build: *app-build
  profiles: ['workers']
  environment:
    <<: *app-environment
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully
  restart: unless-stopped
  init: true
  networks:
    - default
    - coolify
  stop_grace_period: 20s
  deploy:
    resources:
      limits:
        memory: 320m
  logging:
    driver: json-file
    options:
      max-size: '10m'
      max-file: '3'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:?DB_NAME is required}
      POSTGRES_USER: ${DB_USER:?DB_USER is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - default
      - coolify
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    deploy:
      resources:
        limits:
          memory: 512m

  redis:
    image: redis:7-alpine
    # Sin persistencia: solo guarda contadores de rate-limit, seguros de perder y baratos de
    # reconstruir.
    command:
      [
        'redis-server',
        '--save',
        '',
        '--appendonly',
        'no',
        '--maxmemory',
        '256mb',
        '--maxmemory-policy',
        'allkeys-lru',
      ]
    networks:
      - default
      - coolify
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    deploy:
      resources:
        limits:
          memory: 256m

  migrate:
    image: gymsheet-backend:coolify
    build: *app-build
    command: ['node', 'dist/database/migrate.js', 'up']
    environment:
      <<: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'
    networks:
      - default
      - coolify
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  api:
    # `build:` repetido a propósito (ver comentario en `x-worker-service` arriba): sin él,
    # Coolify intenta un `docker pull` de una imagen que nunca se publicó y el despliegue muere
    # con "pull access denied ... repository does not exist". `cache_from` hace que este build
    # reutilice las capas de `migrate` en vez de reconstruir todo de nuevo.
    image: gymsheet-backend:coolify
    build: *app-build
    environment:
      <<: *app-environment
      PORT: '3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    init: true
    networks:
      default: {}
      coolify:
        aliases:
          - gymsheet-backend
    expose:
      - '3000'
    volumes:
      # MEDIA_STORAGE_PROVIDER=local escribe aquí. Sin este volumen cada despliegue estrena
      # contenedor y las imágenes subidas desaparecen sin error: la fila en base de datos
      # sobrevive y la URL devuelve 404. El Dockerfile crea /app/storage/media como `node`
      # para que el volumen herede esa propiedad al crearse.
      - media-data:/app/storage/media
    cpu_shares: 4096
    stop_grace_period: 20s
    deploy:
      resources:
        limits:
          memory: 768m
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/api/v1/gateway/health >/dev/null 2>&1 || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Origen público de esta API (Tailscale Funnel, acceso anónimo). Nodo de tailnet propio
  # (hostname `gymsheet-backend`) por la misma razón que en GymSheetFrontend: los tres puertos
  # de Funnel del VPS ya sirven `/` de otras apps. `TS_SERVE_CONFIG` lo aplica `containerboot`
  # solo, reenviando a `http://gymsheet-backend:3000` por la red `coolify`.
  tunnel:
    image: tailscale/tailscale:v1.90.6
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_HOSTNAME: gymsheet-backend
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /etc/tailscale/serve.json
      TS_ACCEPT_DNS: 'false'
    volumes:
      - tailscale-backend-state:/var/lib/tailscale
      - ./deploy/tailscale-serve.json:/etc/tailscale/serve.json:ro
    networks:
      - coolify
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128m
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  # ---------------------------------------------------------------------------
  # Workers. Apagados por defecto: cada uno es un proceso Node completo (~200 MB
  # con el runtime de Nest dentro) y encenderlos los cinco a ciegas puede dejar
  # sin memoria al VPS y tumbar el despliegue de la API, que es lo que de verdad
  # no puede caerse. Para encenderlos, añadir en las variables de la aplicación
  # en Coolify:
  #
  #     COMPOSE_PROFILES=workers
  #
  # y redesplegar. Docker Compose lee COMPOSE_PROFILES del archivo de entorno que
  # Coolify pasa con --env-file, igual que el resto de variables. Si por lo que
  # sea no lo leyera, el fallo es benigno: los workers no arrancan y todo lo
  # demás queda exactamente como hoy.
  #
  # Reparto de responsabilidades (docs/workers/notification-workers.md):
  #   access-event        → drena la bandeja de eventos de acceso física
  #   membership-reminder → avisos de vencimiento de membresía
  #   notification-delivery → entrega lo que el outbox transaccional deja listo
  #   stories-purge       → borra stories caducadas
  #   exercises-dataset-refresh → refresco del dataset externo de ejercicios;
  #     solo hace trabajo real con EXERCISES_DATASET_ENABLED=true.
  # ---------------------------------------------------------------------------

  worker-access-event:
    <<: *worker-service
    command: ['node', 'dist/workers/access-event.worker.js']

  worker-membership-reminder:
    <<: *worker-service
    command: ['node', 'dist/workers/membership-reminder.worker.js']

  worker-notification-delivery:
    <<: *worker-service
    command: ['node', 'dist/workers/notification-delivery.worker.js']

  worker-stories-purge:
    <<: *worker-service
    command: ['node', 'dist/workers/stories-purge.worker.js']

  worker-exercises-dataset-refresh:
    <<: *worker-service
    command: ['node', 'dist/workers/exercises-dataset-refresh.worker.js']

volumes:
  postgres-data:
  media-data:
  tailscale-backend-state:

networks:
  default: {}
  coolify:
    external: true
    name: coolify
