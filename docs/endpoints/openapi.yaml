      summary: Cambiar el estado de una membresía
      x-required-role: ADMIN, FRONT_DESK
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MembershipAdminMembershipStatusRequest"
