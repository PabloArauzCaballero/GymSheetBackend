  /routines:
    post:
      tags: [Training]
      summary: Crear una rutina propia
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoutineCreateRequest"
      responses:
        "201":
          description: Rutina creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoutineEnvelope"
        "400": { $ref: "#/components/responses/Problem400" }
        "401": { $ref: "#/components/responses/Problem401" }
        "403": { $ref: "#/components/responses/Problem403" }
    get:
      tags: [Training]
      summary: Listar rutinas propias o plantillas
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSize20Param"
        - name: scope
          in: query
          description: Ámbito de la consulta. "mine" = rutinas propias; "templates" = plantillas visibles.
          schema:
            type: string
            enum: [mine, templates]
            default: mine
      responses:
        "200":
          description: Página de rutinas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoutinePageEnvelope"
        "400": { $ref: "#/components/responses/Problem400" }
        "401": { $ref: "#/components/responses/Problem401" }
  /routines/assignments/me:
    get:
      tags: [Training]
      summary: Listar las asignaciones de rutina propias (como cliente)
      responses:
        "200":
          description: Asignaciones del cliente autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoutineAssignmentListEnvelope"
        "401": { $ref: "#/components/responses/Problem401" }
  /routines/assignments/coach:
    get:
      tags: [Training]
      summary: Listar las asignaciones emitidas por el coach autenticado
      x-required-role: "COACH, ADMIN"
      responses:
        "200":
          description: Asignaciones emitidas por el coach
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoutineAssignmentListEnvelope"
        "401": { $ref: "#/components/responses/Problem401" }
        "403": { $ref: "#/components/responses/Problem403" }
  /routines/import:
    post:
      tags: [Training]
      summary: Importar rutinas en bloque (1-200)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoutineImportRequest"
      responses:
        "201":
          description: Resultado de la importación (por rutina)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoutineImportEnvelope"
        "400": { $ref: "#/components/responses/Problem400" }
        "401": { $ref: "#/components/responses/Problem401" }
        "403": { $ref: "#/components/responses/Problem403" }
        "413": { $ref: "#/components/responses/Problem413" }
  /routines/exercises/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Identificador del ejercicio prescrito dentro de la rutina.
        schema: { type: string, format: uuid }
    patch:
      tags: [Training]
      summary: Actualizar un ejercicio prescrito de la rutina
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoutineExerciseUpdateRequest"
      responses:
        "200":
          description: Rutina actualizada con el ejercicio modificado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoutineEnvelope"
        "400": { $ref: "#/components/responses/Problem400" }
        "401": { $ref: "#/components/responses/Problem401" }
        "404": { $ref: "#/components/responses/Problem404" }
        "409": { $ref: "#/components/responses/Problem409" }
    delete:
      tags: [Training]
      summary: Eliminar un ejercicio prescrito de la rutina
      responses:
        "200":
          description: Rutina actualizada sin el ejercicio eliminado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoutineEnvelope"
        "401": { $ref: "#/components/responses/Problem401" }
        "404": { $ref: "#/components/responses/Problem404" }
  /routines/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Training]
      summary: Obtener una rutina visible
      responses:
        "200":
          description: Rutina encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoutineEnvelope"
        "401": { $ref: "#/components/responses/Problem401" }
        "404": { $ref: "#/components/responses/Problem404" }
    patch:
      tags: [Training]
      summary: Actualizar una rutina propia
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoutineUpdateRequest"
      responses:
        "200":
          description: Rutina actualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoutineEnvelope"
        "400": { $ref: "#/components/responses/Problem400" }
        "401": { $ref: "#/components/responses/Problem401" }
        "404": { $ref: "#/components/responses/Problem404" }
    delete:
      tags: [Training]
      summary: Eliminar una rutina propia
      responses:
        "200":
          description: Rutina eliminada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoutineDeleteEnvelope"
        "401": { $ref: "#/components/responses/Problem401" }
        "404": { $ref: "#/components/responses/Problem404" }
  /routines/{id}/exercises:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Training]
      summary: Agregar un ejercicio prescrito a la rutina
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoutineExerciseCreateRequest"
      responses:
        "201":
          description: Rutina actualizada con el nuevo ejercicio
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoutineEnvelope"
        "400": { $ref: "#/components/responses/Problem400" }
        "401": { $ref: "#/components/responses/Problem401" }
        "404": { $ref: "#/components/responses/Problem404" }
        "409": { $ref: "#/components/responses/Problem409" }
  /routines/{id}/assign:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Training]
      summary: Asignar la rutina a un cliente
      x-required-role: "COACH, ADMIN"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoutineAssignRequest"
      responses:
        "201":
          description: Asignación creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoutineAssignmentEnvelope"
        "400": { $ref: "#/components/responses/Problem400" }
        "401": { $ref: "#/components/responses/Problem401" }
        "403": { $ref: "#/components/responses/Problem403" }
        "404": { $ref: "#/components/responses/Problem404" }
        "409": { $ref: "#/components/responses/Problem409" }
  /routines/{id}/start:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Training]
      summary: Iniciar una sesión de entrenamiento desde la rutina
      responses:
        "201":
          description: Sesión de entrenamiento creada a partir de la rutina
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoutineStartedSessionEnvelope"
        "401": { $ref: "#/components/responses/Problem401" }
        "404": { $ref: "#/components/responses/Problem404" }
        "409": { $ref: "#/components/responses/Problem409" }
  # ==== notifications ====
  /notifications/me:
