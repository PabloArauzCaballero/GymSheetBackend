      tags: [Membership]
      summary: Crear un perfil laboral para un usuario con rol de trabajo
      x-required-role: ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MembershipAdminCreateStaffRequest"
      responses:
        "201":
          description: Perfil laboral creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipAdminStaffEnvelope"
        "400": { $ref: "#/components/responses/Problem400" }
        "401": { $ref: "#/components/responses/Problem401" }
        "403": { $ref: "#/components/responses/Problem403" }
        "409": { $ref: "#/components/responses/Problem409" }
        "422":
          description: El usuario no tiene un rol laboral permitido o una sede asignada no existe
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429": { $ref: "#/components/responses/Problem429" }
  /admin/membership/staff/{userId}/status:
    parameters:
      - in: path
        name: userId
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Membership]
      summary: Cambiar el estado laboral de un perfil de personal
      x-required-role: ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MembershipAdminUpdateStaffStatusRequest"
      responses:
        "200":
          description: Perfil laboral con estado actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipAdminStaffEnvelope"
        "400": { $ref: "#/components/responses/Problem400" }
        "401": { $ref: "#/components/responses/Problem401" }
        "403": { $ref: "#/components/responses/Problem403" }
        "404": { $ref: "#/components/responses/Problem404" }
        "422":
          description: La fecha de terminación es obligatoria cuando el estado es TERMINATED
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429": { $ref: "#/components/responses/Problem429" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdParam:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    PageParam:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize25Param:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    PageSize20Param:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
  responses:
    Problem400:
      description: Solicitud inválida
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Problem401:
      description: Autenticación requerida o inválida
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Problem403:
      description: Operación no autorizada
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Problem404:
      description: Recurso no encontrado o no visible
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Problem409:
      description: Conflicto de estado, identidad o regla de negocio
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Problem413:
      description: Petición o exportación síncrona demasiado grande
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Problem422:
      description: Entidad no procesable por regla de negocio o estado requerido
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Problem429:
      description: Límite de peticiones excedido
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Problem503:
      description: Dependencia o conector externo no disponible
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    Problem:
      type: object
      required: [type, title, status, detail, instance, requestId]
      properties:
        type: { type: string, format: uri-reference, example: about:blank }
        title: { type: string, example: Bad Request }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string }
        instance: { type: string }
        requestId: { type: string, format: uuid }
        errors:
          type: array
          items:
            type: object
            additionalProperties: true
    SuccessEnvelope:
      type: object
      required: [ok, data]
      properties:
        ok: { type: boolean, enum: [true] }
        data: {}
    GenericObjectEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: object
              additionalProperties: true
    DeleteEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: object
              required: [deleted]
              properties:
                deleted: { type: boolean, enum: [true] }
    RegisterRequest:
      type: object
      required: [email, password, nombreCompleto]
      additionalProperties: false
      properties:
        email: { type: string, format: email, maxLength: 180 }
        password:
          { type: string, minLength: 8, maxLength: 128, format: password }
        nombreCompleto: { type: string, minLength: 3, maxLength: 180 }
    LoginRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email: { type: string, format: email, maxLength: 180 }
        password:
          { type: string, minLength: 8, maxLength: 128, format: password }
    AuthUser:
      type: object
      required: [id, email, nombreCompleto, rol]
      properties:
        id: { type: string, format: uuid }
