          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipAdminPlanEnvelope"
        "400": { $ref: "#/components/responses/Problem400" }
        "401": { $ref: "#/components/responses/Problem401" }
        "403": { $ref: "#/components/responses/Problem403" }
        "404": { $ref: "#/components/responses/Problem404" }
        "422":
          description: Una sede o sala del alcance no existe o la sala no pertenece a su sede
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429": { $ref: "#/components/responses/Problem429" }
  /admin/membership/customers:
