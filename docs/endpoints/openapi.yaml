openapi: 3.0.3
info:
  title: GymSheet API
  version: 1.1.0-hardening
  description: |
    API autenticada para perfiles, catálogo de ejercicios, multimedia y sesiones de entrenamiento.
    Los nombres externos en español se mantienen por compatibilidad con la versión 1.
servers:
  - url: http://localhost:3001/api/v1
    description: Desarrollo local
security:
  - bearerAuth: []
tags:
  - name: Auth
  - name: Users
  - name: Profile
  - name: Onboarding
  - name: Membership
  - name: Equipment
  - name: Exercises
  - name: Exercise media
  - name: Favorites
  - name: Workouts
  - name: Export
  - name: Administration
  - name: Gateway
  - name: Access control
  - name: Facilities
  - name: Notifications
  - name: Training
paths:
  /auth/register:
    post:
      tags: [Auth]
      security: []
      summary: Registrar un cliente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Usuario registrado y token emitido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthEnvelope"
        "400": { $ref: "#/components/responses/Problem400" }
        "409": { $ref: "#/components/responses/Problem409" }
        "429": { $ref: "#/components/responses/Problem429" }
  /auth/login:
    post:
      tags: [Auth]
      security: []
      summary: Iniciar sesión
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "201":
          description: Credenciales válidas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthEnvelope"
        "400": { $ref: "#/components/responses/Problem400" }
        "401": { $ref: "#/components/responses/Problem401" }
        "429": { $ref: "#/components/responses/Problem429" }
  /auth/me:
    get:
      tags: [Auth]
      summary: Obtener el principal autenticado
      responses:
        "200":
          description: Principal revalidado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticatedPrincipalEnvelope"
        "401": { $ref: "#/components/responses/Problem401" }
  /users/me:
    get:
      tags: [Users]
      summary: Obtener el usuario activo persistido
      responses:
        "200":
          description: Usuario activo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserEnvelope"
        "401": { $ref: "#/components/responses/Problem401" }
        "404": { $ref: "#/components/responses/Problem404" }
  /profile:
    get:
      tags: [Profile]
      summary: Consultar el perfil antropométrico propio
      responses:
        "200":
          description: Perfil encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileEnvelope"
        "404": { $ref: "#/components/responses/Problem404" }
    post:
      tags: [Profile]
      summary: Crear o reemplazar el perfil propio
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileRequest"
      responses:
        "201":
          description: Perfil guardado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileEnvelope"
        "400": { $ref: "#/components/responses/Problem400" }
    patch:
      tags: [Profile]
      summary: Actualizar el perfil propio
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileRequest"
      responses:
        "200":
          description: Perfil actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileEnvelope"
        "400": { $ref: "#/components/responses/Problem400" }
  /equipment:
    get:
      tags: [Equipment]
      summary: Listar equipamiento disponible
      responses:
        "200":
          description: Catálogo disponible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EquipmentListEnvelope"
  /admin/equipment:
    post:
      tags: [Administration]
      summary: Crear equipamiento
      x-required-role: ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEquipmentRequest"
      responses:
        "201":
          description: Equipamiento creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EquipmentEnvelope"
        "400": { $ref: "#/components/responses/Problem400" }
        "403": { $ref: "#/components/responses/Problem403" }
        "409": { $ref: "#/components/responses/Problem409" }
  /admin/equipment/{id}:
    parameters:
      - $ref: "#/components/parameters/IdParam"
    patch:
      tags: [Administration]
      summary: Actualizar equipamiento
      x-required-role: ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEquipmentRequest"
      responses:
        "200":
          description: Equipamiento actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EquipmentEnvelope"
        "400": { $ref: "#/components/responses/Problem400" }
        "403": { $ref: "#/components/responses/Problem403" }
        "404": { $ref: "#/components/responses/Problem404" }
    delete:
      tags: [Administration]
      summary: Inhabilitar equipamiento
      x-required-role: ADMIN
      responses:
        "200":
          description: Equipamiento inhabilitado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EquipmentEnvelope"
        "403": { $ref: "#/components/responses/Problem403" }
        "404": { $ref: "#/components/responses/Problem404" }
  /exercises:
    get:
      tags: [Exercises]
      summary: Listar ejercicios visibles
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSize25Param"
        - name: search
          in: query
          schema: { type: string, minLength: 1, maxLength: 120 }
        - name: grupoMuscular
          in: query
          schema: { type: string, maxLength: 100 }
        - name: equipoId
          in: query
          schema: { type: string, format: uuid }
        - name: bodyPart
          in: query
          schema: { type: string, maxLength: 100 }
        - name: targetMuscle
          in: query
          schema: { type: string, maxLength: 120 }
        - name: dataSource
          in: query
          schema:
            type: string
            enum: [CUSTOM, EXERCISES_DATASET]
      responses:
        "200":
          description: Página de ejercicios
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExercisePageEnvelope"
        "400": { $ref: "#/components/responses/Problem400" }
  /exercises/{id}:
    parameters:
      - $ref: "#/components/parameters/IdParam"
    get:
      tags: [Exercises]
      summary: Obtener ejercicio visible
      responses:
        "200":
          description: Ejercicio visible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExerciseEnvelope"
        "404": { $ref: "#/components/responses/Problem404" }
    patch:
      tags: [Exercises]
      summary: Actualizar ejercicio personal propio
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateExerciseRequest"
      responses:
        "200":
          description: Ejercicio actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExerciseEnvelope"
        "400": { $ref: "#/components/responses/Problem400" }
        "403": { $ref: "#/components/responses/Problem403" }
        "404": { $ref: "#/components/responses/Problem404" }
    delete:
      tags: [Exercises]
      summary: Inhabilitar ejercicio personal propio
      responses:
        "200":
          description: Ejercicio inhabilitado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExerciseEnvelope"
        "403": { $ref: "#/components/responses/Problem403" }
        "404": { $ref: "#/components/responses/Problem404" }
  /exercises/personal:
    post:
      tags: [Exercises]
      summary: Crear ejercicio personal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateExerciseRequest"
      responses:
        "201":
          description: Ejercicio creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExerciseEnvelope"
        "400": { $ref: "#/components/responses/Problem400" }
  /admin/exercises/global:
    post:
      tags: [Administration]
      summary: Crear ejercicio global
      x-required-role: ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateExerciseRequest"
      responses:
        "201":
          description: Ejercicio global creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExerciseEnvelope"
        "400": { $ref: "#/components/responses/Problem400" }
        "403": { $ref: "#/components/responses/Problem403" }
  /admin/exercises/global/{id}:
    parameters:
      - $ref: "#/components/parameters/IdParam"
    patch:
      tags: [Administration]
      summary: Actualizar ejercicio global
      x-required-role: ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateExerciseRequest"
      responses:
        "200":
          description: Ejercicio global actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExerciseEnvelope"
        "400": { $ref: "#/components/responses/Problem400" }
        "403": { $ref: "#/components/responses/Problem403" }
        "404": { $ref: "#/components/responses/Problem404" }
    delete:
      tags: [Administration]
      summary: Inhabilitar ejercicio global
      x-required-role: ADMIN
      responses:
        "200":
          description: Ejercicio global inhabilitado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExerciseEnvelope"
        "403": { $ref: "#/components/responses/Problem403" }
        "404": { $ref: "#/components/responses/Problem404" }
  /exercises/{exerciseId}/media:
    parameters:
      - name: exerciseId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Exercise media]
      summary: Listar multimedia activa del ejercicio visible
      responses:
        "200":
          description: Multimedia activa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExerciseMediaListEnvelope"
        "404": { $ref: "#/components/responses/Problem404" }
    post:
      tags: [Exercise media]
      summary: Registrar multimedia
      description: Requiere propiedad del ejercicio personal o rol ADMIN para un ejercicio global.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateExerciseMediaRequest"
      responses:
        "201":
          description: Multimedia registrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExerciseMediaEnvelope"
        "400": { $ref: "#/components/responses/Problem400" }
        "403": { $ref: "#/components/responses/Problem403" }
        "404": { $ref: "#/components/responses/Problem404" }
        "409": { $ref: "#/components/responses/Problem409" }
  /exercise-media/{mediaId}:
    parameters:
      - name: mediaId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [Exercise media]
      summary: Inhabilitar multimedia
      responses:
        "200":
          description: Multimedia inhabilitada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteEnvelope"
        "403": { $ref: "#/components/responses/Problem403" }
        "404": { $ref: "#/components/responses/Problem404" }
  /user-exercises:
    get:
      tags: [Favorites]
      summary: Listar ejercicios frecuentes
      responses:
        "200":
          description: Ejercicios frecuentes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FavoriteListEnvelope"
  /user-exercises/{exerciseId}:
    parameters:
      - name: exerciseId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Favorites]
      summary: Agregar ejercicio frecuente
      responses:
        "201":
          description: Frecuente creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObjectEnvelope"
        "404": { $ref: "#/components/responses/Problem404" }
        "409": { $ref: "#/components/responses/Problem409" }
    delete:
      tags: [Favorites]
      summary: Quitar ejercicio frecuente
      responses:
        "200":
          description: Frecuente eliminado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteEnvelope"
        "404": { $ref: "#/components/responses/Problem404" }
  /workouts:
    post:
      tags: [Workouts]
      summary: Iniciar sesión de entrenamiento
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkoutRequest"
      responses:
        "201":
          description: Sesión creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkoutEnvelope"
        "400": { $ref: "#/components/responses/Problem400" }
        "409": { $ref: "#/components/responses/Problem409" }
    get:
      tags: [Workouts]
      summary: Listar historial propio
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSize20Param"
      responses:
        "200":
          description: Página de sesiones
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkoutPageEnvelope"
        "400": { $ref: "#/components/responses/Problem400" }
  /workouts/{id}:
    parameters:
      - $ref: "#/components/parameters/IdParam"
    get:
      tags: [Workouts]
      summary: Obtener sesión propia
      responses:
        "200":
          description: Sesión encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkoutEnvelope"
        "404": { $ref: "#/components/responses/Problem404" }
  /workouts/{id}/finish:
    parameters:
      - $ref: "#/components/parameters/IdParam"
    patch:
      tags: [Workouts]
      summary: Finalizar sesión en progreso
      responses:
        "200":
          description: Sesión finalizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkoutEnvelope"
        "403": { $ref: "#/components/responses/Problem403" }
        "404": { $ref: "#/components/responses/Problem404" }
  /workouts/{id}/cancel:
    parameters:
      - $ref: "#/components/parameters/IdParam"
    patch:
      tags: [Workouts]
      summary: Cancelar sesión en progreso
      responses:
        "200":
          description: Sesión cancelada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkoutEnvelope"
        "403": { $ref: "#/components/responses/Problem403" }
        "404": { $ref: "#/components/responses/Problem404" }
  /workouts/{sessionId}/exercises:
    parameters:
      - name: sessionId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Workouts]
      summary: Agregar ejercicio a sesión
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddSessionExerciseRequest"
      responses:
        "201":
          description: Ejercicio agregado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObjectEnvelope"
        "400": { $ref: "#/components/responses/Problem400" }
        "403": { $ref: "#/components/responses/Problem403" }
        "404": { $ref: "#/components/responses/Problem404" }
        "409": { $ref: "#/components/responses/Problem409" }
  /workouts/session-exercises/{id}:
    parameters:
      - $ref: "#/components/parameters/IdParam"
    patch:
      tags: [Workouts]
      summary: Actualizar ejercicio de sesión
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSessionExerciseRequest"
      responses:
        "200":
          description: Ejercicio de sesión actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObjectEnvelope"
        "400": { $ref: "#/components/responses/Problem400" }
        "403": { $ref: "#/components/responses/Problem403" }
        "404": { $ref: "#/components/responses/Problem404" }
        "409": { $ref: "#/components/responses/Problem409" }
    delete:
      tags: [Workouts]
      summary: Eliminar ejercicio de sesión
      responses:
        "200":
          description: Ejercicio eliminado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteEnvelope"
        "403": { $ref: "#/components/responses/Problem403" }
        "404": { $ref: "#/components/responses/Problem404" }
  /workouts/session-exercises/{id}/sets:
    parameters:
      - $ref: "#/components/parameters/IdParam"
    post:
      tags: [Workouts]
      summary: Registrar serie
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkoutSetRequest"
      responses:
        "201":
          description: Serie registrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObjectEnvelope"
        "400": { $ref: "#/components/responses/Problem400" }
        "403": { $ref: "#/components/responses/Problem403" }
        "404": { $ref: "#/components/responses/Problem404" }
        "409": { $ref: "#/components/responses/Problem409" }
  /workouts/sets/{id}:
    parameters:
      - $ref: "#/components/parameters/IdParam"
    patch:
      tags: [Workouts]
      summary: Actualizar serie propia
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateWorkoutSetRequest"
      responses:
        "200":
          description: Serie actualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObjectEnvelope"
        "400": { $ref: "#/components/responses/Problem400" }
        "403": { $ref: "#/components/responses/Problem403" }
        "404": { $ref: "#/components/responses/Problem404" }
    delete:
      tags: [Workouts]
      summary: Eliminar serie propia
      responses:
        "200":
          description: Serie eliminada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteEnvelope"
        "403": { $ref: "#/components/responses/Problem403" }
        "404": { $ref: "#/components/responses/Problem404" }
  /export/workout-history:
    get:
      tags: [Export]
      summary: Exportar historial propio como JSON
      responses:
        "200":
          description: Historial acotado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObjectEnvelope"
        "413": { $ref: "#/components/responses/Problem413" }
  /export/workout-history/csv:
    get:
      tags: [Export]
      summary: Exportar historial propio como CSV
      responses:
        "200":
          description: CSV protegido contra fórmulas
          headers:
            Content-Disposition:
              schema: { type: string }
          content:
            text/csv:
              schema: { type: string }
        "413": { $ref: "#/components/responses/Problem413" }
  /admin/exercises/import/exercises-dataset:
    post:
      tags: [Administration]
      summary: Importar el dataset externo de ejercicios
      description: Deshabilitado por defecto. Requiere rol ADMIN y configuración explícita del conector.
      x-required-role: ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DatasetImportRequest"
      responses:
        "201":
          description: Resultado de importación o dry run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObjectEnvelope"
        "400": { $ref: "#/components/responses/Problem400" }
        "403": { $ref: "#/components/responses/Problem403" }
        "503": { $ref: "#/components/responses/Problem503" }
  /admin/exercises/import/exercises-dataset/status:
    get:
      tags: [Administration]
      summary: Consultar el estado de la caché externa de ejercicios
      description: Lee el checkpoint PostgreSQL sin contactar el origen externo.
      x-required-role: ADMIN
      responses:
        "200":
          description: Último refresco exitoso y próxima ejecución diaria
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObjectEnvelope"
        "403": { $ref: "#/components/responses/Problem403" }
  /gateway/health:
    get:
      tags: [Gateway]
      security: []
      summary: Liveness HTTP
      responses:
        "200":
          description: Proceso activo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObjectEnvelope"
  /gateway/routes:
    get:
      tags: [Gateway]
      security: []
      summary: Capacidades públicas resumidas
      responses:
        "200":
          description: Resumen no sensible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObjectEnvelope"
  /me/onboarding:
    get:
      tags: [Onboarding]
      summary: Consultar estado y campos pendientes del onboarding
      responses:
        "200":
          description: Estado persistente del onboarding
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OnboardingStateEnvelope" }
        "401": { $ref: "#/components/responses/Problem401" }
  /me/onboarding/profile:
    put:
      tags: [Onboarding]
      summary: Guardar medidas, unidades y fecha de medición
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OnboardingProfileRequest" }
      responses:
        "200":
          description: Progreso actualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OnboardingStateEnvelope" }
        "400": { $ref: "#/components/responses/Problem400" }
        "401": { $ref: "#/components/responses/Problem401" }
  /me/onboarding/goals:
    put:
      tags: [Onboarding]
      summary: Guardar objetivo principal
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OnboardingGoalsRequest" }
      responses:
        "200":
          description: Progreso actualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OnboardingStateEnvelope" }
        "400": { $ref: "#/components/responses/Problem400" }
        "401": { $ref: "#/components/responses/Problem401" }
  /me/onboarding/preferences:
    put:
      tags: [Onboarding]
      summary: Guardar preferencias y consentimientos
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { $ref: "#/components/schemas/OnboardingPreferencesRequest" }
      responses:
        "200":
          description: Progreso actualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OnboardingStateEnvelope" }
        "400": { $ref: "#/components/responses/Problem400" }
        "401": { $ref: "#/components/responses/Problem401" }
  /me/onboarding/equipment:
    put:
      tags: [Onboarding]
      summary: Guardar equipamiento disponible
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { $ref: "#/components/schemas/OnboardingEquipmentRequest" }
      responses:
        "200":
          description: Progreso actualizado
