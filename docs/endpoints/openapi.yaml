components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdParam:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    PageParam:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize25Param:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    PageSize20Param:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
  responses:
    Problem400:
      description: Solicitud inválida
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Problem401:
      description: Autenticación requerida o inválida
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Problem403:
      description: Operación no autorizada
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Problem404:
      description: Recurso no encontrado o no visible
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Problem409:
      description: Conflicto de estado, identidad o regla de negocio
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Problem413:
      description: Petición o exportación síncrona demasiado grande
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Problem422:
      description: Entidad no procesable por regla de negocio o estado requerido
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Problem429:
      description: Límite de peticiones excedido
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Problem503:
      description: Dependencia o conector externo no disponible
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    Problem:
      type: object
      required: [type, title, status, detail, instance, requestId]
      properties:
        type: { type: string, format: uri-reference, example: about:blank }
        title: { type: string, example: Bad Request }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string }
        instance: { type: string }
        requestId: { type: string, format: uuid }
        errors:
          type: array
          items:
            type: object
            additionalProperties: true
    SuccessEnvelope:
      type: object
      required: [ok, data]
      properties:
        ok: { type: boolean, enum: [true] }
        data: {}
    GenericObjectEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: object
              additionalProperties: true
    DeleteEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: object
              required: [deleted]
              properties:
                deleted: { type: boolean, enum: [true] }
    RegisterRequest:
      type: object
      required:
        [email, password, nombreCompleto, genero, fechaNacimiento, termsVersion, acceptedTerms]
      additionalProperties: false
      properties:
        email: { type: string, format: email, maxLength: 180 }
        password:
          { type: string, minLength: 8, maxLength: 128, format: password }
        nombreCompleto: { type: string, minLength: 3, maxLength: 180 }
        tenantId: { type: string, maxLength: 60 }
        genero: { type: string, enum: [MALE, FEMALE] }
        fechaNacimiento:
          { type: string, format: date, description: "YYYY-MM-DD; age 18 to 100 today" }
        termsVersion:
          type: string
          maxLength: 20
          description: Must equal the current TERMS version (GET /legal/current); otherwise 409 TERMS_VERSION_OUTDATED.
        acceptedTerms: { type: boolean, enum: [true] }
    LoginRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email: { type: string, format: email, maxLength: 180 }
        password:
          { type: string, minLength: 8, maxLength: 128, format: password }
    BusinessSignupRequest:
      type: object
      additionalProperties: false
      required: [email, password, businessName, entityType, acceptances]
      properties:
        email: { type: string, format: email, maxLength: 180 }
        password: { type: string, minLength: 8, maxLength: 128 }
        businessName: { type: string, minLength: 2, maxLength: 180 }
        entityType: { type: string, enum: [GYM, COACH, CENTER, STORE, SERVICE_PROVIDER] }
        legalKind: { type: string, enum: [COMPANY, INDIVIDUAL], description: Solo SERVICE_PROVIDER (obligatorio ahí) }
        acceptances:
          type: array
          description: Todo el conjunto de GET /legal/current?accountKind=BUSINESS
          items:
            type: object
            required: [document, version]
            properties:
              document: { type: string, enum: [BUSINESS_TERMS, BUSINESS_DPA, PRIVACY] }
              version: { type: string }
              contentSha256: { type: string, pattern: "^[0-9a-f]{64}$" }
        ticket: { type: string }
        website: { type: string, description: Honeypot }
        turnstileToken: { type: string }
        attestation:
          type: object
          properties:
            platform: { type: string, enum: [ios, android] }
            token: { type: string }
            nonce: { type: string }
    BusinessSummary:
      type: object
      properties:
        entityId: { type: string, format: uuid }
        entityType: { type: string, enum: [GYM, COACH, CENTER, STORE, SERVICE_PROVIDER] }
        legalKind: { type: string, enum: [COMPANY, INDIVIDUAL] }
        status: { type: string, enum: [ONBOARDING, ACTIVE, SUSPENDED, CLOSED] }
        kycStatus: { type: string, enum: [DRAFT, SUBMITTED, AUTO_APPROVED, IN_REVIEW, APPROVED, REJECTED, SUSPENDED] }
    BusinessSignupEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: object
              properties:
                accessToken: { type: string }
                refreshToken: { type: string }
                tokenType: { type: string, enum: [Bearer] }
                user: { $ref: "#/components/schemas/AuthUser" }
                business: { $ref: "#/components/schemas/BusinessSummary" }
    BusinessHandle:
      type: object
      properties:
        handle: { type: string }
        status: { type: string, enum: [PENDING, ACTIVE] }
    BusinessHandleEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/BusinessHandle" }
    BusinessProfilePatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 2, maxLength: 180 }
        headline: { type: string, maxLength: 255, nullable: true }
        description: { type: string, maxLength: 5000 }
        primaryCategoryId: { type: string, format: uuid }
        city: { type: string, minLength: 2, maxLength: 100 }
        country: { type: string, minLength: 2, maxLength: 60 }
        address: { type: string, maxLength: 500, nullable: true }
        isOnlineOnly: { type: boolean }
        contactInfo:
          type: object
          description: Claves phone, whatsapp, email, website, instagram, facebook, tiktok
          additionalProperties: { type: string, maxLength: 200 }
        businessHours:
          type: object
          description: Claves mon..sun
          additionalProperties:
            type: object
            properties:
              open: { type: string, pattern: "^([01]\\d|2[0-3]):[0-5]\\d$" }
              close: { type: string, pattern: "^([01]\\d|2[0-3]):[0-5]\\d$" }
    BusinessMeEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: object
              properties:
                account:
                  allOf:
                    - $ref: "#/components/schemas/BusinessSummary"
                    - type: object
                      properties:
                        userId: { type: string, format: uuid }
                        email: { type: string, format: email }
                        emailVerified: { type: boolean }
                        accountKind: { type: string, enum: [BUSINESS] }
                        createdAt: { type: string, format: date-time }
                entity: { type: object, additionalProperties: true }
                handle:
                  allOf:
                    - $ref: "#/components/schemas/BusinessHandle"
                  nullable: true
                nextSteps:
                  type: array
                  items: { type: string, enum: [VERIFY_EMAIL, CHOOSE_HANDLE, COMPLETE_PROFILE, SUBMIT_KYC] }
    AuthUser:
      type: object
      required: [id, email, nombreCompleto, rol]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        nombreCompleto: { type: string }
        rol:
          type: string
          enum: [SYSTEM_ADMIN, MODERATOR, ADMIN, CLIENTE, ENTRENADOR_EXTERNO, COACH, FRONT_DESK, NEGOCIO]
        accountKind: { type: string, enum: [PERSON, BUSINESS] }
    AuthEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: object
              required: [accessToken, tokenType, user]
              properties:
                accessToken: { type: string }
                tokenType: { type: string, enum: [Bearer] }
                user: { $ref: "#/components/schemas/AuthUser" }
    AuthenticatedPrincipalEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: object
              required: [id, email, role]
              properties:
                id: { type: string, format: uuid }
                email: { type: string, format: email }
                role:
                  type: string
                  enum: [SYSTEM_ADMIN, MODERATOR, ADMIN, CLIENTE, ENTRENADOR_EXTERNO, COACH, FRONT_DESK, NEGOCIO]
                accountKind: { type: string, enum: [PERSON, BUSINESS] }
                businessEntityId: { type: string, format: uuid, nullable: true }
    UserEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: object
              additionalProperties: true
    UpdateAccountRequest:
      type: object
      additionalProperties: false
      required: [nombreCompleto]
      properties:
        nombreCompleto: { type: string, minLength: 3, maxLength: 180 }
    CloseAccountRequest:
      type: object
      additionalProperties: false
      description: Exactamente uno de los dos.
      properties:
        password: { type: string, maxLength: 128 }
        pin: { type: string, pattern: "^\\d{6}$" }
    EmailChangeRequest:
      type: object
      additionalProperties: false
      required: [newEmail, password]
      properties:
        newEmail: { type: string, format: email, maxLength: 180 }
        password: { type: string, maxLength: 128 }
    PinRequest:
      type: object
      additionalProperties: false
      required: [pin]
      properties:
        pin: { type: string, pattern: "^\\d{6}$" }
    ClosurePreviewItem:
      type: object
      required: [table, label, count, reason]
      properties:
        table: { type: string, example: social.map_locations }
        label: { type: string }
        count: { type: integer, minimum: 1 }
        reason: { type: string, nullable: true }
    ClosurePreviewEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: object
              required: [allowed, proof, account, deleted, anonymized, kept]
              properties:
                allowed: { type: boolean }
                proof:
                  type: object
                  properties:
                    password: { type: boolean, enum: [true] }
                    emailPin: { type: boolean }
                account: { type: object, additionalProperties: true }
                deleted: { type: array, items: { $ref: "#/components/schemas/ClosurePreviewItem" } }
                anonymized: { type: array, items: { $ref: "#/components/schemas/ClosurePreviewItem" } }
                kept: { type: array, items: { $ref: "#/components/schemas/ClosurePreviewItem" } }
    AccountExportEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: object
              required: [id, status, requestedAt, downloadPath]
              properties:
                id: { type: string, format: uuid }
                status: { type: string, enum: [PENDING, READY, FAILED] }
                requestedAt: { type: string, format: date-time }
                completedAt: { type: string, format: date-time, nullable: true }
                expiresAt: { type: string, format: date-time, nullable: true }
                sizeBytes: { type: integer, nullable: true }
                downloadPath: { type: string, nullable: true, example: "/me/export/{id}/download" }
    ProfileRequest:
      type: object
      required: [edad, pesoKg, estaturaCm, objetivo]
      additionalProperties: false
      properties:
        edad: { type: integer, minimum: 12, maximum: 100 }
        pesoKg: { type: number, minimum: 1, maximum: 400 }
        estaturaCm: { type: integer, minimum: 80, maximum: 250 }
        objetivo:
          type: string
          enum:
            [
              HIPERTROFIA,
              FUERZA,
              RESISTENCIA,
              PERDIDA_GRASA,
              SALUD_GENERAL,
              REHABILITACION,
            ]
    ProfileEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: object
              additionalProperties: true
    EquipmentType:
      type: string
      enum:
        [MAQUINA, MANCUERNA, BARRA, DISCO, BANCO, POLEA, BANDA, ACCESORIO, OTRO]
    EquipmentStatus:
      type: string
      enum: [DISPONIBLE, MANTENIMIENTO, INACTIVO]
    OnboardingProfileRequest:
      type: object
      required: [weight, weightUnit, height, heightUnit, measuredOn]
      additionalProperties: false
      properties:
        weight:
          { type: number, minimum: 0, exclusiveMinimum: true, maximum: 1000 }
        weightUnit: { type: string, enum: [KG, LB] }
        height:
          { type: number, minimum: 0, exclusiveMinimum: true, maximum: 300 }
        heightUnit: { type: string, enum: [CM, IN] }
        measuredOn: { type: string, format: date }
        idempotencyKey: { type: string, minLength: 8, maxLength: 120 }
    OnboardingGoalsRequest:
      type: object
      required: [primaryGoal]
      additionalProperties: false
      properties:
        primaryGoal:
          type: string
          enum:
            [
              GAIN_MUSCLE,
              LOSE_FAT,
              IMPROVE_STRENGTH,
              IMPROVE_ENDURANCE,
              MAINTAIN_FITNESS,
              GENERAL_HEALTH,
              SPORT_PERFORMANCE,
            ]
    OnboardingPreferencesRequest:
      type: object
      required:
        [
          experienceLevel,
          weeklyFrequency,
          trainingLocation,
          trainingPreferences,
          consentHealth,
          consentData,
        ]
      additionalProperties: false
      properties:
        experienceLevel:
          { type: string, enum: [BEGINNER, INTERMEDIATE, ADVANCED] }
        weeklyFrequency: { type: integer, minimum: 1, maximum: 7 }
        trainingLocation:
          { type: string, enum: [GYM, HOME, OUTDOORS, MIXED] }
        trainingPreferences:
          type: array
          maxItems: 20
          items: { type: string, minLength: 1, maxLength: 80 }
        physicalConsiderations:
          { type: string, nullable: true, maxLength: 2000 }
        consentHealth: { type: boolean }
        consentData: { type: boolean }
    OnboardingEquipmentRequest:
      type: object
      required: [availableEquipment]
      additionalProperties: false
      properties:
        availableEquipment:
          type: array
          maxItems: 50
          items: { type: string, minLength: 1, maxLength: 80 }
    BodyMeasurementRequest:
      type: object
      required: [weight, unit, measuredOn]
      additionalProperties: false
      properties:
        weight:
          { type: number, minimum: 0, exclusiveMinimum: true, maximum: 1000 }
        unit: { type: string, enum: [KG, LB] }
        measuredOn: { type: string, format: date }
        idempotencyKey: { type: string, minLength: 8, maxLength: 120 }
    OnboardingState:
      type: object
      additionalProperties: true
      required: [status]
      properties:
        status:
          type: string
          enum: [NOT_STARTED, IN_PROGRESS, COMPLETED, REQUIRES_UPDATE]
        currentStep: { type: string, nullable: true }
        completedSteps:
          type: array
          items: { type: string }
        missingFields:
          type: array
          items: { type: string }
        profileComplete: { type: boolean }
    BodyMeasurement:
      type: object
      additionalProperties: true
      required: [id, weight, unit, measuredOn]
      properties:
        id: { type: string, format: uuid }
        weight: { type: number }
        unit: { type: string, enum: [KG, LB] }
        measuredOn: { type: string, format: date }
        source: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    OnboardingStateEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/OnboardingState" }
    BodyMeasurementEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/BodyMeasurement" }
    BodyMeasurementListEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/BodyMeasurement" }
    EquipmentAssetFields:
      type: object
      properties:
        etiquetaActivo: { type: string, nullable: true, minLength: 1, maxLength: 100 }
        numeroSerie: { type: string, nullable: true, minLength: 1, maxLength: 180 }
        fabricante: { type: string, nullable: true, minLength: 1, maxLength: 160 }
        modelo: { type: string, nullable: true, minLength: 1, maxLength: 160 }
        fechaCompra: { type: string, format: date, nullable: true }
        garantiaHasta: { type: string, format: date, nullable: true }
        intervaloServicioDias:
          { type: integer, nullable: true, minimum: 1, maximum: 3650 }
        proximoServicio: { type: string, format: date, nullable: true }
        razonFueraServicio: { type: string, nullable: true, minLength: 1, maxLength: 2000 }
        metadata:
          type: object
          description: El JSON serializado no puede superar 16 KiB.
          additionalProperties: true
    CreateEquipmentRequest:
      type: object
      required: [nombre, tipo]
      additionalProperties: false
      properties:
        nombre: { type: string, minLength: 2, maxLength: 140 }
        tipo: { $ref: "#/components/schemas/EquipmentType" }
        descripcion: { type: string, nullable: true, maxLength: 1000 }
        etiquetaActivo: { type: string, nullable: true, minLength: 1, maxLength: 100 }
        numeroSerie: { type: string, nullable: true, minLength: 1, maxLength: 180 }
        fabricante: { type: string, nullable: true, minLength: 1, maxLength: 160 }
        modelo: { type: string, nullable: true, minLength: 1, maxLength: 160 }
        fechaCompra: { type: string, format: date, nullable: true }
        garantiaHasta: { type: string, format: date, nullable: true }
        intervaloServicioDias:
          { type: integer, nullable: true, minimum: 1, maximum: 3650 }
        proximoServicio: { type: string, format: date, nullable: true }
        razonFueraServicio: { type: string, nullable: true, minLength: 1, maxLength: 2000 }
        metadata: { type: object, additionalProperties: true }
    UpdateEquipmentRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        nombre: { type: string, minLength: 2, maxLength: 140 }
        tipo: { $ref: "#/components/schemas/EquipmentType" }
        descripcion: { type: string, nullable: true, maxLength: 1000 }
        estado: { $ref: "#/components/schemas/EquipmentStatus" }
        etiquetaActivo: { type: string, nullable: true, minLength: 1, maxLength: 100 }
        numeroSerie: { type: string, nullable: true, minLength: 1, maxLength: 180 }
        fabricante: { type: string, nullable: true, minLength: 1, maxLength: 160 }
        modelo: { type: string, nullable: true, minLength: 1, maxLength: 160 }
        fechaCompra: { type: string, format: date, nullable: true }
        garantiaHasta: { type: string, format: date, nullable: true }
        intervaloServicioDias:
          { type: integer, nullable: true, minimum: 1, maximum: 3650 }
        proximoServicio: { type: string, format: date, nullable: true }
        razonFueraServicio: { type: string, nullable: true, minLength: 1, maxLength: 2000 }
        metadata: { type: object, additionalProperties: true }
    Equipment:
      type: object
      required: [id, nombre, tipo, estado]
      allOf:
        - $ref: "#/components/schemas/EquipmentAssetFields"
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string }
        tipo: { $ref: "#/components/schemas/EquipmentType" }
        descripcion: { type: string, nullable: true }
        estado: { $ref: "#/components/schemas/EquipmentStatus" }
    EquipmentEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/Equipment" }
    EquipmentListEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/Equipment" }
    LocalizedInstructions:
      type: object
      maxProperties: 20
      additionalProperties:
        type: string
        minLength: 1
        maxLength: 6000
    LocalizedInstructionSteps:
      type: object
      maxProperties: 20
      additionalProperties:
        type: array
        minItems: 1
        maxItems: 30
        items: { type: string, minLength: 1, maxLength: 1000 }
    CreateExerciseRequest:
      type: object
      required: [nombre, grupoMuscular]
      additionalProperties: false
      properties:
        nombre: { type: string, minLength: 2, maxLength: 160 }
        grupoMuscular: { type: string, minLength: 2, maxLength: 120 }
        descripcion: { type: string, nullable: true, maxLength: 2000 }
        equipoIds:
          type: array
          maxItems: 30
          items: { type: string, format: uuid }
        bodyPart: { type: string, nullable: true, minLength: 2, maxLength: 100 }
        targetMuscle:
          { type: string, nullable: true, minLength: 2, maxLength: 120 }
        synergistMuscleGroup:
          { type: string, nullable: true, minLength: 2, maxLength: 120 }
        secondaryMuscles:
          type: array
          maxItems: 30
          items: { type: string, minLength: 2, maxLength: 120 }
        instructions: { $ref: "#/components/schemas/LocalizedInstructions" }
        instructionSteps:
          { $ref: "#/components/schemas/LocalizedInstructionSteps" }
        metadata:
          type: object
          description: El JSON serializado no puede superar 16 KiB.
          additionalProperties: true
    UpdateExerciseRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        nombre: { type: string, minLength: 2, maxLength: 160 }
        grupoMuscular: { type: string, minLength: 2, maxLength: 120 }
        descripcion: { type: string, nullable: true, maxLength: 2000 }
        equipoIds:
          type: array
          maxItems: 30
          items: { type: string, format: uuid }
        bodyPart: { type: string, nullable: true, minLength: 2, maxLength: 100 }
        targetMuscle:
          { type: string, nullable: true, minLength: 2, maxLength: 120 }
        synergistMuscleGroup:
          { type: string, nullable: true, minLength: 2, maxLength: 120 }
        secondaryMuscles:
          type: array
          maxItems: 30
          items: { type: string, minLength: 2, maxLength: 120 }
        instructions: { $ref: "#/components/schemas/LocalizedInstructions" }
        instructionSteps:
          { $ref: "#/components/schemas/LocalizedInstructionSteps" }
        metadata:
          type: object
          additionalProperties: true
    Exercise:
      type: object
      required: [id, nombre, grupoMuscular, tipoEjercicio, estado]
      additionalProperties: true
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string }
        grupoMuscular: { type: string }
        descripcion: { type: string, nullable: true }
        tipoEjercicio: { type: string, enum: [GLOBAL, PERSONAL] }
        estado: { type: string, enum: [ACTIVO, INACTIVO] }
        dataSource: { type: string, enum: [CUSTOM, EXERCISES_DATASET] }
        media:
          type: array
          items: { $ref: "#/components/schemas/ExerciseMedia" }
    ExerciseEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/Exercise" }
    ExercisePageEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: object
              required: [items, page, pageSize, total, totalPages]
              properties:
                items:
                  type: array
                  items: { $ref: "#/components/schemas/Exercise" }
                page: { type: integer, minimum: 1 }
                pageSize: { type: integer, minimum: 1, maximum: 100 }
                total: { type: integer, minimum: 0 }
                totalPages: { type: integer, minimum: 0 }
    CreateExerciseMediaRequest:
      type: object
      required: [mediaType, provider, url, altText]
      additionalProperties: false
      properties:
        mediaType: { type: string, enum: [IMAGE, GIF, VIDEO] }
        provider: { type: string, enum: [EXTERNAL_URL, CLOUDINARY, S3, LOCAL] }
        externalId:
          { type: string, nullable: true, minLength: 1, maxLength: 180 }
        url:
          { type: string, format: uri, maxLength: 2048, pattern: "^https://" }
        thumbnailUrl:
          {
            type: string,
            format: uri,
            nullable: true,
            maxLength: 2048,
            pattern: "^https://",
          }
        mimeType: { type: string, nullable: true, minLength: 3, maxLength: 120 }
        width: { type: integer, nullable: true, minimum: 1, maximum: 10000 }
        height: { type: integer, nullable: true, minimum: 1, maximum: 10000 }
        checksumSha256:
          { type: string, nullable: true, pattern: "^[a-fA-F0-9]{64}$" }
        altText: { type: string, minLength: 3, maxLength: 500 }
        attribution: { type: string, nullable: true, maxLength: 2000 }
        license: { type: string, nullable: true, maxLength: 160 }
        isPrimary: { type: boolean, default: false }
        sortOrder: { type: integer, minimum: 0, maximum: 1000, default: 0 }
        metadata:
          type: object
          additionalProperties: true
          default: {}
    ExerciseMedia:
      type: object
      required:
        [
          id,
          exerciseId,
          mediaType,
          provider,
          url,
          altText,
          isPrimary,
          sortOrder,
          status,
        ]
      additionalProperties: true
      properties:
        id: { type: string, format: uuid }
        exerciseId: { type: string, format: uuid }
        mediaType: { type: string, enum: [IMAGE, GIF, VIDEO] }
        provider: { type: string, enum: [EXTERNAL_URL, CLOUDINARY, S3, LOCAL] }
        url: { type: string, format: uri }
        altText: { type: string }
        isPrimary: { type: boolean }
        sortOrder: { type: integer }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
    ExerciseMediaEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/ExerciseMedia" }
    ExerciseMediaListEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/ExerciseMedia" }
    FavoriteListEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: array
              items:
                type: object
                additionalProperties: true
    CreateWorkoutRequest:
      type: object
      additionalProperties: false
      properties:
        observacion: { type: string, nullable: true, maxLength: 1000 }
    AddSessionExerciseRequest:
      type: object
      required: [ejercicioId, orden]
      additionalProperties: false
      properties:
        ejercicioId: { type: string, format: uuid }
        orden: { type: integer, minimum: 1, maximum: 500 }
        esEnfasis: { type: boolean, default: false }
        nota: { type: string, nullable: true, maxLength: 1000 }
    UpdateSessionExerciseRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        orden: { type: integer, minimum: 1, maximum: 500 }
        esEnfasis: { type: boolean }
        nota: { type: string, nullable: true, maxLength: 1000 }
    WorkoutSetRequest:
      type: object
      description: >-
        Serie de fuerza por repeticiones (repeticiones, pesoKg y rir obligatorios) o por
        tiempo (duracionSeg 1–3600, sin repeticiones; pesoKg y rir opcionales). La serie por
        tiempo solo se admite si el ejercicio de la sesión tiene duracionSeg
        (si no, 400 SET_DURATION_NOT_ALLOWED).
      required: [numeroSerie, descansoSegAnterior]
      additionalProperties: false
      properties:
        tipoSerie: { type: string, enum: [FUERZA, CARDIO], default: FUERZA }
        numeroSerie: { type: integer, minimum: 1, maximum: 100 }
        repeticiones: { type: integer, minimum: 1, maximum: 1000 }
        pesoKg: { type: number, minimum: 0, maximum: 2000 }
        rir: { type: integer, minimum: 0, maximum: 10 }
        duracionSeg: { type: integer, minimum: 1, maximum: 3600 }
        descansoSegAnterior: { type: integer, minimum: 0, maximum: 7200 }
    UpdateWorkoutSetRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        numeroSerie: { type: integer, minimum: 1, maximum: 100 }
        repeticiones: { type: integer, minimum: 1, maximum: 1000 }
        pesoKg: { type: number, minimum: 0, maximum: 2000 }
        rir: { type: integer, minimum: 0, maximum: 10 }
        duracionSeg:
          type: integer
          minimum: 1
          maximum: 86400
          description: Solo en series por tiempo (≤ 3600) o de cardio; si no, 400 SET_KIND_MISMATCH.
        descansoSegAnterior: { type: integer, minimum: 0, maximum: 7200 }
    Workout:
      type: object
      required: [id, estado]
      additionalProperties: true
      properties:
        id: { type: string, format: uuid }
        estado: { type: string, enum: [EN_PROGRESO, FINALIZADA, CANCELADA] }
    WorkoutEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/Workout" }
    WorkoutPageEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: object
              required: [items, page, pageSize, total, totalPages]
              properties:
                items:
                  type: array
                  items: { $ref: "#/components/schemas/Workout" }
                page: { type: integer, minimum: 1 }
                pageSize: { type: integer, minimum: 1, maximum: 100 }
                total: { type: integer, minimum: 0 }
                totalPages: { type: integer, minimum: 0 }
    DatasetImportRequest:
      type: object
      additionalProperties: false
      properties:
        dryRun: { type: boolean, default: false }
        importMedia:
          type: boolean
          description: Solo se permite si la configuración confirma explícitamente la licencia.
    # ==== access ====
    FacilityStatus:
      type: string
      enum: [ACTIVE, INACTIVE]
    FacilityRoomType:
      type: string
      enum: [TRAINING, CARDIO, FUNCTIONAL, CLASSROOM, LOCKER, RECEPTION, STAFF, OTHER]
    FacilityRoomStatus:
      type: string
      enum: [ACTIVE, MAINTENANCE, CLOSED, INACTIVE]
    FacilityAccessDirection:
      type: string
      enum: [ENTRY, EXIT, BOTH]
    FacilityMaintenanceType:
      type: string
      enum: [PREVENTIVE, CORRECTIVE, INSPECTION]
    FacilityMaintenanceStatus:
      type: string
      enum: [SCHEDULED, IN_PROGRESS, COMPLETED, CANCELLED]

    # --- Objetos de metadatos ---
    FacilityMetadata:
      type: object
      description: Objeto libre. El JSON serializado no puede superar 16 KiB.
      additionalProperties: true

    # --- Request bodies ---
    FacilityCreateBranchRequest:
      type: object
      required: [codigo, nombre]
      additionalProperties: false
      properties:
        codigo:
          type: string
          minLength: 2
          maxLength: 80
          pattern: "^[A-Za-z0-9._-]+$"
          description: Se normaliza a mayúsculas en el servidor.
        nombre: { type: string, minLength: 2, maxLength: 180 }
        descripcion: { type: string, nullable: true, maxLength: 2000 }
        zonaHoraria:
          type: string
          minLength: 3
          maxLength: 80
          default: America/La_Paz
        metadata:
          allOf:
            - $ref: "#/components/schemas/FacilityMetadata"
          default: {}
    FacilityUpdateBranchRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        nombre: { type: string, minLength: 2, maxLength: 180 }
        descripcion: { type: string, nullable: true, maxLength: 2000 }
        zonaHoraria: { type: string, minLength: 3, maxLength: 80 }
        estado: { $ref: "#/components/schemas/FacilityStatus" }
        metadata: { $ref: "#/components/schemas/FacilityMetadata" }
    FacilityCreateRoomRequest:
      type: object
      required: [sedeId, codigo, nombre, tipoSala]
      additionalProperties: false
      properties:
        sedeId: { type: string, format: uuid }
        codigo:
          type: string
          minLength: 2
          maxLength: 80
          pattern: "^[A-Za-z0-9._-]+$"
          description: Se normaliza a mayúsculas en el servidor.
        nombre: { type: string, minLength: 2, maxLength: 180 }
        tipoSala: { $ref: "#/components/schemas/FacilityRoomType" }
        capacidad:
          type: integer
          nullable: true
          minimum: 1
          maximum: 100000
        metadata:
          allOf:
            - $ref: "#/components/schemas/FacilityMetadata"
          default: {}
    FacilityUpdateRoomRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        nombre: { type: string, minLength: 2, maxLength: 180 }
        tipoSala: { $ref: "#/components/schemas/FacilityRoomType" }
        capacidad:
          type: integer
          nullable: true
          minimum: 1
          maximum: 100000
        estado: { $ref: "#/components/schemas/FacilityRoomStatus" }
        metadata: { $ref: "#/components/schemas/FacilityMetadata" }
    FacilityCreateAccessPointRequest:
      type: object
      required: [sedeId, codigo, nombre]
      additionalProperties: false
      properties:
        sedeId: { type: string, format: uuid }
        salaId: { type: string, format: uuid, nullable: true }
        codigo:
          type: string
          minLength: 2
          maxLength: 80
          pattern: "^[A-Za-z0-9._-]+$"
          description: Se normaliza a mayúsculas en el servidor.
        nombre: { type: string, minLength: 2, maxLength: 180 }
        direccionPermitida:
          allOf:
            - $ref: "#/components/schemas/FacilityAccessDirection"
          default: BOTH
        metadata:
          allOf:
            - $ref: "#/components/schemas/FacilityMetadata"
          default: {}
    FacilityAssignEquipmentRequest:
      type: object
      required: [equipoId, salaId]
      additionalProperties: false
      properties:
        equipoId: { type: string, format: uuid }
        salaId: { type: string, format: uuid }
        notas: { type: string, nullable: true, maxLength: 2000 }
    FacilityScheduleMaintenanceRequest:
      type: object
      required: [equipoId, tipo, programadoPara, descripcion]
      additionalProperties: false
      properties:
        equipoId: { type: string, format: uuid }
        tipo: { $ref: "#/components/schemas/FacilityMaintenanceType" }
        programadoPara: { type: string, format: date }
        descripcion: { type: string, minLength: 3, maxLength: 4000 }
        proveedor: { type: string, nullable: true, maxLength: 180 }
        tecnico: { type: string, nullable: true, maxLength: 180 }
        metadata:
          allOf:
            - $ref: "#/components/schemas/FacilityMetadata"
          default: {}
    FacilityCompleteMaintenanceRequest:
      type: object
      required: [resolucion]
      additionalProperties: false
      description: >-
        costo y moneda deben enviarse juntos: ambos presentes o ambos ausentes.
      properties:
        hallazgos: { type: string, nullable: true, maxLength: 4000 }
        resolucion: { type: string, minLength: 3, maxLength: 4000 }
        costo:
          type: number
          nullable: true
          minimum: 0
          maximum: 9999999999
        moneda:
          type: string
          nullable: true
          pattern: "^[A-Z]{3}$"

    # --- Objetos de respuesta (forma de los mappers) ---
    FacilityBranch:
      type: object
      required: [id, codigo, nombre, descripcion, zonaHoraria, estado, metadata]
      properties:
        id: { type: string, format: uuid }
        codigo: { type: string }
        nombre: { type: string }
        descripcion: { type: string, nullable: true }
        zonaHoraria: { type: string }
        estado: { $ref: "#/components/schemas/FacilityStatus" }
        metadata: { $ref: "#/components/schemas/FacilityMetadata" }
    FacilityRoom:
      type: object
      required: [id, sedeId, codigo, nombre, tipoSala, capacidad, estado, metadata]
      properties:
        id: { type: string, format: uuid }
        sedeId: { type: string, format: uuid }
        codigo: { type: string }
        nombre: { type: string }
        tipoSala: { $ref: "#/components/schemas/FacilityRoomType" }
        capacidad: { type: integer, nullable: true }
        estado: { $ref: "#/components/schemas/FacilityRoomStatus" }
        metadata: { $ref: "#/components/schemas/FacilityMetadata" }
    FacilityAccessPoint:
      type: object
      required: [id, sedeId, salaId, codigo, nombre, direccionPermitida, estado, metadata]
      properties:
        id: { type: string, format: uuid }
        sedeId: { type: string, format: uuid }
        salaId: { type: string, format: uuid, nullable: true }
        codigo: { type: string }
        nombre: { type: string }
        direccionPermitida: { $ref: "#/components/schemas/FacilityAccessDirection" }
        estado: { $ref: "#/components/schemas/FacilityStatus" }
        metadata: { $ref: "#/components/schemas/FacilityMetadata" }
    FacilityEquipmentAssignment:
      type: object
      required: [id, equipoId, salaId, asignadoEn, finalizadoEn, notas, asignadoPorUsuarioId]
      properties:
        id: { type: string, format: uuid }
        equipoId: { type: string, format: uuid }
        salaId: { type: string, format: uuid }
        asignadoEn: { type: string, format: date-time }
        finalizadoEn: { type: string, format: date-time, nullable: true }
        notas: { type: string, nullable: true }
        asignadoPorUsuarioId: { type: string, format: uuid, nullable: true }
    FacilityMaintenance:
      type: object
      required:
        [
          id,
          equipoId,
          tipo,
          estado,
          programadoPara,
          iniciadoEn,
          completadoEn,
          proveedor,
          tecnico,
          descripcion,
          hallazgos,
          resolucion,
          costo,
          moneda,
        ]
      properties:
        id: { type: string, format: uuid }
        equipoId: { type: string, format: uuid }
        tipo: { $ref: "#/components/schemas/FacilityMaintenanceType" }
        estado: { $ref: "#/components/schemas/FacilityMaintenanceStatus" }
        programadoPara: { type: string, format: date }
        iniciadoEn: { type: string, format: date-time, nullable: true }
        completadoEn: { type: string, format: date-time, nullable: true }
        proveedor: { type: string, nullable: true }
        tecnico: { type: string, nullable: true }
        descripcion: { type: string }
        hallazgos: { type: string, nullable: true }
        resolucion: { type: string, nullable: true }
        costo: { type: number, nullable: true }
        moneda: { type: string, nullable: true }

    # --- Envelopes de éxito ---
    FacilityBranchEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/FacilityBranch" }
    FacilityBranchPageEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: object
              required: [items, page, pageSize, total, totalPages]
              properties:
                items:
                  type: array
                  items: { $ref: "#/components/schemas/FacilityBranch" }
                page: { type: integer, minimum: 1 }
                pageSize: { type: integer, minimum: 1, maximum: 100 }
                total: { type: integer, minimum: 0 }
                totalPages: { type: integer, minimum: 0 }
    FacilityRoomEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/FacilityRoom" }
    FacilityRoomPageEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: object
              required: [items, page, pageSize, total, totalPages]
              properties:
                items:
                  type: array
                  items: { $ref: "#/components/schemas/FacilityRoom" }
                page: { type: integer, minimum: 1 }
                pageSize: { type: integer, minimum: 1, maximum: 100 }
                total: { type: integer, minimum: 0 }
                totalPages: { type: integer, minimum: 0 }
    FacilityAccessPointEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/FacilityAccessPoint" }
    FacilityAccessPointListEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/FacilityAccessPoint" }
    FacilityEquipmentAssignmentEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/FacilityEquipmentAssignment" }
    FacilityMaintenanceEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/FacilityMaintenance" }
    FacilityMaintenancePageEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: object
              required: [items, page, pageSize, total, totalPages]
              properties:
                items:
                  type: array
                  items: { $ref: "#/components/schemas/FacilityMaintenance" }
                page: { type: integer, minimum: 1 }
                pageSize: { type: integer, minimum: 1, maximum: 100 }
                total: { type: integer, minimum: 0 }
                totalPages: { type: integer, minimum: 0 }
    # ==== training ====
    RoutineVisibility:
      type: string
      enum: [PRIVATE, SHARED, TEMPLATE]
    RoutineStatus:
      type: string
      enum: [ACTIVE, ARCHIVED]
    RoutineAssignmentStatus:
      type: string
      enum: [ACTIVE, COMPLETED, CANCELLED]
    RoutineGoal:
      type: string
      enum: [HIPERTROFIA, FUERZA, RESISTENCIA, PERDIDA_GRASA, SALUD_GENERAL, REHABILITACION]
    RoutineExerciseCreateRequest:
      type: object
      required: [orden]
      additionalProperties: false
      description: >-
        Ejercicio prescrito. Debe incluir "ejercicioId" o "ejercicioNombre" (al menos uno).
        Si se envían "repsMin" y "repsMax", "repsMax" debe ser >= "repsMin".
      properties:
        ejercicioId: { type: string, format: uuid }
        ejercicioNombre: { type: string, minLength: 1, maxLength: 160 }
        orden: { type: integer, minimum: 1, maximum: 500 }
        seriesObjetivo: { type: integer, minimum: 1, maximum: 100, default: 3 }
        repsMin: { type: integer, nullable: true, minimum: 1, maximum: 1000 }
        repsMax: { type: integer, nullable: true, minimum: 1, maximum: 1000 }
        pesoObjetivoKg: { type: number, nullable: true, minimum: 0, maximum: 2000 }
        rirObjetivo: { type: integer, nullable: true, minimum: 0, maximum: 10 }
        descansoSeg: { type: integer, nullable: true, minimum: 0, maximum: 7200 }
        nota: { type: string, nullable: true, maxLength: 1000 }
    RoutineExerciseUpdateRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      description: >-
        Debe enviar al menos un campo. Si se envían "repsMin" y "repsMax", "repsMax" debe ser >= "repsMin".
      properties:
        orden: { type: integer, minimum: 1, maximum: 500 }
        seriesObjetivo: { type: integer, minimum: 1, maximum: 100 }
        repsMin: { type: integer, nullable: true, minimum: 1, maximum: 1000 }
        repsMax: { type: integer, nullable: true, minimum: 1, maximum: 1000 }
        pesoObjetivoKg: { type: number, nullable: true, minimum: 0, maximum: 2000 }
        rirObjetivo: { type: integer, nullable: true, minimum: 0, maximum: 10 }
        descansoSeg: { type: integer, nullable: true, minimum: 0, maximum: 7200 }
        nota: { type: string, nullable: true, maxLength: 1000 }
    RoutineCreateRequest:
      type: object
      required: [nombre]
      additionalProperties: false
      properties:
        nombre: { type: string, minLength: 2, maxLength: 160 }
        descripcion: { type: string, nullable: true, maxLength: 4000 }
        visibilidad:
          allOf:
            - $ref: "#/components/schemas/RoutineVisibility"
          default: PRIVATE
        objetivo:
          oneOf:
            - $ref: "#/components/schemas/RoutineGoal"
          nullable: true
    RoutineUpdateRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      description: Debe enviar al menos un campo para actualizar.
      properties:
        nombre: { type: string, minLength: 2, maxLength: 160 }
        descripcion: { type: string, nullable: true, maxLength: 4000 }
        visibilidad: { $ref: "#/components/schemas/RoutineVisibility" }
        objetivo:
          oneOf:
            - $ref: "#/components/schemas/RoutineGoal"
          nullable: true
        estado: { $ref: "#/components/schemas/RoutineStatus" }
    RoutineImportItem:
      type: object
      required: [nombre, ejercicios]
      additionalProperties: false
      properties:
        nombre: { type: string, minLength: 2, maxLength: 160 }
        descripcion: { type: string, nullable: true, maxLength: 4000 }
        visibilidad:
          allOf:
            - $ref: "#/components/schemas/RoutineVisibility"
          default: PRIVATE
        objetivo:
          oneOf:
            - $ref: "#/components/schemas/RoutineGoal"
          nullable: true
        ejercicios:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: "#/components/schemas/RoutineExerciseCreateRequest" }
    RoutineImportRequest:
      type: object
      required: [rutinas]
      additionalProperties: false
      properties:
        rutinas:
          type: array
          minItems: 1
          maxItems: 200
          items: { $ref: "#/components/schemas/RoutineImportItem" }
    RoutineExerciseResponse:
      type: object
      additionalProperties: true
      required: [id, orden, seriesObjetivo, ejercicio]
      properties:
        id: { type: string, format: uuid }
        orden: { type: integer }
        seriesObjetivo: { type: integer }
        repsMin: { type: integer, nullable: true }
        repsMax: { type: integer, nullable: true }
        pesoObjetivoKg: { type: number, nullable: true }
        rirObjetivo: { type: integer, nullable: true }
        descansoSeg: { type: integer, nullable: true }
        nota: { type: string, nullable: true }
        ejercicio:
          type: object
          nullable: true
          additionalProperties: true
          description: Ejercicio de catálogo asociado (forma de Exercise) o null.
    RoutineResponse:
      type: object
      additionalProperties: true
      required:
        [id, nombre, creadoPorUsuarioId, visibilidad, estado, ejercicios, fechaCreacion, fechaActualizacion]
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string }
        descripcion: { type: string, nullable: true }
        creadoPorUsuarioId: { type: string, format: uuid }
        visibilidad: { $ref: "#/components/schemas/RoutineVisibility" }
        objetivo:
          oneOf:
            - $ref: "#/components/schemas/RoutineGoal"
          nullable: true
        estado: { $ref: "#/components/schemas/RoutineStatus" }
        ejercicios:
          type: array
          items: { $ref: "#/components/schemas/RoutineExerciseResponse" }
        fechaCreacion: { type: string, format: date-time }
        fechaActualizacion: { type: string, format: date-time }
    RoutineAssignmentResponse:
      type: object
      additionalProperties: true
      required:
        [id, rutinaId, clienteUsuarioId, asignadoPorUsuarioId, estado, diasSemana, fechaCreacion]
      properties:
        id: { type: string, format: uuid }
        rutinaId: { type: string, format: uuid }
        clienteUsuarioId: { type: string, format: uuid }
        asignadoPorUsuarioId: { type: string, format: uuid }
        estado: { $ref: "#/components/schemas/RoutineAssignmentStatus" }
        fechaProgramada: { type: string, format: date, nullable: true }
        diasSemana:
          type: array
          items: { type: integer, minimum: 0, maximum: 6 }
        nota: { type: string, nullable: true }
        clienteNombre: { type: string, nullable: true }
        clienteEmail: { type: string, format: email, nullable: true }
        rutina:
          oneOf:
            - $ref: "#/components/schemas/RoutineResponse"
          nullable: true
        fechaCreacion: { type: string, format: date-time }
    RoutineImportResultItem:
      type: object
      required: [index, nombre, creada, routineId, error]
      properties:
        index: { type: integer, minimum: 0 }
        nombre: { type: string }
        creada: { type: boolean }
        routineId: { type: string, format: uuid, nullable: true }
        error: { type: string, nullable: true }
    RoutineEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/RoutineResponse" }
    RoutinePageEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: object
              required: [items, page, pageSize, total, totalPages]
              properties:
                items:
                  type: array
                  items: { $ref: "#/components/schemas/RoutineResponse" }
                page: { type: integer, minimum: 1 }
                pageSize: { type: integer, minimum: 1, maximum: 100 }
                total: { type: integer, minimum: 0 }
                totalPages: { type: integer, minimum: 0 }
    RoutineAssignmentListEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/RoutineAssignmentResponse" }
    RoutineDeleteEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: object
              required: [deleted]
              properties:
                deleted: { type: boolean, enum: [true] }
    RoutineImportEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: object
              required: [resultados, creadas]
              properties:
                resultados:
                  type: array
                  items: { $ref: "#/components/schemas/RoutineImportResultItem" }
                creadas: { type: integer, minimum: 0 }
    RoutineStartedSessionEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: object
              additionalProperties: true
              required: [id, estado]
              description: Sesión de entrenamiento creada (forma de Workout).
              properties:
                id: { type: string, format: uuid }
                estado: { type: string, enum: [EN_PROGRESO, FINALIZADA, CANCELADA] }
    # ==== notifications ====
    NotificationChannel:
      type: string
      enum: [IN_APP, HTTP_GATEWAY, MOCK]
    NotificationStatus:
      type: string
      enum: [PENDING, SENT, FAILED, DEAD_LETTER, READ]
    Notification:
      type: object
      required: [id, canal, mensaje, estado, creadoEn]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        membresiaId: { type: string, format: uuid, nullable: true }
        canal: { $ref: "#/components/schemas/NotificationChannel" }
        asunto: { type: string, nullable: true }
        mensaje: { type: string }
        diasRestantes: { type: integer, nullable: true }
        estado: { $ref: "#/components/schemas/NotificationStatus" }
        leidoEn: { type: string, format: date-time, nullable: true }
        enviadoEn: { type: string, format: date-time, nullable: true }
        creadoEn: { type: string, format: date-time }
    NotificationPreference:
      type: object
      required:
        - recordatoriosVencimiento
        - canalPreferido
        - consentimientoExternoEn
        - versionConsentimiento
        - horaSilencioInicio
        - horaSilencioFin
      additionalProperties: false
      properties:
        recordatoriosVencimiento: { type: boolean }
        canalPreferido:
          type: string
          enum: [IN_APP, HTTP_GATEWAY]
        consentimientoExternoEn: { type: string, format: date-time, nullable: true }
        versionConsentimiento: { type: string, nullable: true }
        horaSilencioInicio:
          type: string
          nullable: true
          pattern: "^([01]\\d|2[0-3]):[0-5]\\d(:[0-5]\\d)?$"
        horaSilencioFin:
          type: string
          nullable: true
          pattern: "^([01]\\d|2[0-3]):[0-5]\\d(:[0-5]\\d)?$"
    UpdateNotificationPreferenceRequest:
      type: object
      required: [recordatoriosVencimiento, canalPreferido]
      additionalProperties: false
      properties:
        recordatoriosVencimiento: { type: boolean }
        canalPreferido:
          type: string
          enum: [IN_APP, HTTP_GATEWAY]
        consentimientoExternoEn:
          type: string
          format: date-time
          nullable: true
        versionConsentimiento:
          type: string
          minLength: 1
          maxLength: 80
          nullable: true
        horaSilencioInicio:
          type: string
          nullable: true
          pattern: "^([01]\\d|2[0-3]):[0-5]\\d(:[0-5]\\d)?$"
        horaSilencioFin:
          type: string
          nullable: true
          pattern: "^([01]\\d|2[0-3]):[0-5]\\d(:[0-5]\\d)?$"
        metadata:
          type: object
          additionalProperties: true
          default: {}
          description: El JSON serializado no puede superar 4 KiB.
    NotificationEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/Notification" }
    NotificationPreferenceEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/NotificationPreference" }
    NotificationPageEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: object
              required: [items, page, pageSize, total, totalPages]
              properties:
                items:
                  type: array
                  items: { $ref: "#/components/schemas/Notification" }
                page: { type: integer, minimum: 1 }
                pageSize: { type: integer, minimum: 1, maximum: 100 }
                total: { type: integer, minimum: 0 }
                totalPages: { type: integer, minimum: 0 }
                fechaNegocio:
                  type: string
                  format: date
                  description: Fecha de negocio con la que se calcularon los días restantes.