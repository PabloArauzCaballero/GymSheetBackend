        dispositivoExternoId: { type: string }
        nombre: { type: string }
        estado: { $ref: "#/components/schemas/AccessDeviceStatus" }
        vistoPorUltimaVezEn: { type: string, format: date-time, nullable: true }
        metadata:
          type: object
          additionalProperties: true
    AccessDecision:
      type: object
      required:
        - id
        - eventoDispositivoId
        - usuarioId
        - resultado
        - razon
        - decididoEn
        - versionPolitica
      additionalProperties: true
      properties:
        id: { type: string, format: uuid }
        eventoDispositivoId: { type: string, format: uuid }
        usuarioId: { type: string, format: uuid }
        resultado: { $ref: "#/components/schemas/AccessDecisionOutcome" }
        razon: { $ref: "#/components/schemas/AccessDecisionReason" }
        membresiaId: { type: string, format: uuid, nullable: true }
        perfilPersonalId: { type: string, format: uuid, nullable: true }
        diasRestantes: { type: integer, nullable: true }
        decididoEn: { type: string, format: date-time }
        versionPolitica: { type: string }
    AccessDeviceEvent:
      type: object
      required:
        - id
        - dispositivoId
        - eventoOrigenId
        - credencialId
        - direccion
        - ocurridoEn
        - recibidoEn
        - estadoCola
      additionalProperties: true
      properties:
        id: { type: string, format: uuid }
        dispositivoId: { type: string, format: uuid }
        eventoOrigenId: { type: string }
        credencialId: { type: string, format: uuid }
        direccion: { type: string, enum: [ENTRY, EXIT] }
        ocurridoEn: { type: string, format: date-time }
        recibidoEn: { type: string, format: date-time }
        estadoCola: { $ref: "#/components/schemas/AccessQueueItemStatus" }
        decision:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/AccessDecision"
    AccessCredential:
      type: object
      required:
        - id
        - usuarioId
        - tipo
        - proveedor
        - estado
        - referenciaExternaRegistrada
        - registradoEn
      additionalProperties: true
      properties:
        id: { type: string, format: uuid }
        usuarioId: { type: string, format: uuid }
        tipo: { $ref: "#/components/schemas/AccessCredentialType" }
        proveedor: { type: string }
        estado: { $ref: "#/components/schemas/AccessCredentialStatus" }
        referenciaExternaRegistrada: { type: boolean }
        versionConsentimiento: { type: string, nullable: true }
        consentimientoRegistradoEn: { type: string, format: date-time, nullable: true }
        registradoEn: { type: string, format: date-time }
        verificadoPorUltimaVezEn: { type: string, format: date-time, nullable: true }
        revocadoEn: { type: string, format: date-time, nullable: true }
    AccessDeviceEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/AccessDevice" }
    AccessDeviceListEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/AccessDevice" }
    AccessDeviceEventEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/AccessDeviceEvent" }
    AccessCredentialEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/AccessCredential" }
    AccessCredentialListEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/AccessCredential" }
    AccessHistoryPageEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: object
              required: [items, page, pageSize, total, totalPages]
              properties:
                items:
                  type: array
                  items: { $ref: "#/components/schemas/AccessDecision" }
                page: { type: integer, minimum: 1 }
                pageSize: { type: integer, minimum: 1, maximum: 100 }
                total: { type: integer, minimum: 0 }
                totalPages: { type: integer, minimum: 0 }
    # ==== facilities ====
    # Fragmentos de schemas OpenAPI 3.0.3 para el dominio FACILITIES.
    # Insertar bajo components.schemas del documento principal (docs/endpoints/openapi.yaml).
    # Reutiliza SuccessEnvelope y Problem ya definidos en ese documento.

    # --- Enums ---
    FacilityStatus:
      type: string
      enum: [ACTIVE, INACTIVE]
    FacilityRoomType:
      type: string
      enum: [TRAINING, CARDIO, FUNCTIONAL, CLASSROOM, LOCKER, RECEPTION, STAFF, OTHER]
    FacilityRoomStatus:
      type: string
      enum: [ACTIVE, MAINTENANCE, CLOSED, INACTIVE]
    FacilityAccessDirection:
      type: string
      enum: [ENTRY, EXIT, BOTH]
    FacilityMaintenanceType:
      type: string
      enum: [PREVENTIVE, CORRECTIVE, INSPECTION]
    FacilityMaintenanceStatus:
      type: string
      enum: [SCHEDULED, IN_PROGRESS, COMPLETED, CANCELLED]

    # --- Objetos de metadatos ---
    FacilityMetadata:
      type: object
      description: Objeto libre. El JSON serializado no puede superar 16 KiB.
      additionalProperties: true

    # --- Request bodies ---
    FacilityCreateBranchRequest:
      type: object
      required: [codigo, nombre]
      additionalProperties: false
      properties:
        codigo:
          type: string
          minLength: 2
          maxLength: 80
          pattern: "^[A-Za-z0-9._-]+$"
          description: Se normaliza a mayúsculas en el servidor.
        nombre: { type: string, minLength: 2, maxLength: 180 }
        descripcion: { type: string, nullable: true, maxLength: 2000 }
        zonaHoraria:
          type: string
          minLength: 3
          maxLength: 80
          default: America/La_Paz
        metadata:
          allOf:
            - $ref: "#/components/schemas/FacilityMetadata"
          default: {}
    FacilityUpdateBranchRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        nombre: { type: string, minLength: 2, maxLength: 180 }
        descripcion: { type: string, nullable: true, maxLength: 2000 }
        zonaHoraria: { type: string, minLength: 3, maxLength: 80 }
        estado: { $ref: "#/components/schemas/FacilityStatus" }
        metadata: { $ref: "#/components/schemas/FacilityMetadata" }
    FacilityCreateRoomRequest:
      type: object
      required: [sedeId, codigo, nombre, tipoSala]
      additionalProperties: false
      properties:
        sedeId: { type: string, format: uuid }
        codigo:
          type: string
          minLength: 2
          maxLength: 80
          pattern: "^[A-Za-z0-9._-]+$"
          description: Se normaliza a mayúsculas en el servidor.
        nombre: { type: string, minLength: 2, maxLength: 180 }
        tipoSala: { $ref: "#/components/schemas/FacilityRoomType" }
        capacidad:
          type: integer
          nullable: true
          minimum: 1
          maximum: 100000
        metadata:
          allOf:
            - $ref: "#/components/schemas/FacilityMetadata"
          default: {}
    FacilityUpdateRoomRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        nombre: { type: string, minLength: 2, maxLength: 180 }
        tipoSala: { $ref: "#/components/schemas/FacilityRoomType" }
        capacidad:
          type: integer
          nullable: true
          minimum: 1
          maximum: 100000
        estado: { $ref: "#/components/schemas/FacilityRoomStatus" }
        metadata: { $ref: "#/components/schemas/FacilityMetadata" }
    FacilityCreateAccessPointRequest:
      type: object
      required: [sedeId, codigo, nombre]
      additionalProperties: false
      properties:
        sedeId: { type: string, format: uuid }
        salaId: { type: string, format: uuid, nullable: true }
        codigo:
          type: string
          minLength: 2
          maxLength: 80
          pattern: "^[A-Za-z0-9._-]+$"
          description: Se normaliza a mayúsculas en el servidor.
        nombre: { type: string, minLength: 2, maxLength: 180 }
        direccionPermitida:
          allOf:
            - $ref: "#/components/schemas/FacilityAccessDirection"
          default: BOTH
        metadata:
          allOf:
            - $ref: "#/components/schemas/FacilityMetadata"
          default: {}
    FacilityAssignEquipmentRequest:
      type: object
      required: [equipoId, salaId]
      additionalProperties: false
      properties:
        equipoId: { type: string, format: uuid }
        salaId: { type: string, format: uuid }
        notas: { type: string, nullable: true, maxLength: 2000 }
    FacilityScheduleMaintenanceRequest:
      type: object
      required: [equipoId, tipo, programadoPara, descripcion]
      additionalProperties: false
      properties:
        equipoId: { type: string, format: uuid }
        tipo: { $ref: "#/components/schemas/FacilityMaintenanceType" }
        programadoPara: { type: string, format: date }
        descripcion: { type: string, minLength: 3, maxLength: 4000 }
        proveedor: { type: string, nullable: true, maxLength: 180 }
        tecnico: { type: string, nullable: true, maxLength: 180 }
        metadata:
          allOf:
            - $ref: "#/components/schemas/FacilityMetadata"
          default: {}
    FacilityCompleteMaintenanceRequest:
      type: object
      required: [resolucion]
      additionalProperties: false
      description: >-
        costo y moneda deben enviarse juntos: ambos presentes o ambos ausentes.
      properties:
        hallazgos: { type: string, nullable: true, maxLength: 4000 }
        resolucion: { type: string, minLength: 3, maxLength: 4000 }
        costo:
          type: number
          nullable: true
          minimum: 0
          maximum: 9999999999
        moneda:
          type: string
          nullable: true
          pattern: "^[A-Z]{3}$"

    # --- Objetos de respuesta (forma de los mappers) ---
    FacilityBranch:
      type: object
      required: [id, codigo, nombre, descripcion, zonaHoraria, estado, metadata]
      properties:
        id: { type: string, format: uuid }
        codigo: { type: string }
        nombre: { type: string }
        descripcion: { type: string, nullable: true }
        zonaHoraria: { type: string }
        estado: { $ref: "#/components/schemas/FacilityStatus" }
        metadata: { $ref: "#/components/schemas/FacilityMetadata" }
    FacilityRoom:
      type: object
      required: [id, sedeId, codigo, nombre, tipoSala, capacidad, estado, metadata]
      properties:
        id: { type: string, format: uuid }
        sedeId: { type: string, format: uuid }
        codigo: { type: string }
        nombre: { type: string }
        tipoSala: { $ref: "#/components/schemas/FacilityRoomType" }
        capacidad: { type: integer, nullable: true }
        estado: { $ref: "#/components/schemas/FacilityRoomStatus" }
        metadata: { $ref: "#/components/schemas/FacilityMetadata" }
    FacilityAccessPoint:
      type: object
      required: [id, sedeId, salaId, codigo, nombre, direccionPermitida, estado, metadata]
      properties:
        id: { type: string, format: uuid }
        sedeId: { type: string, format: uuid }
        salaId: { type: string, format: uuid, nullable: true }
        codigo: { type: string }
        nombre: { type: string }
        direccionPermitida: { $ref: "#/components/schemas/FacilityAccessDirection" }
        estado: { $ref: "#/components/schemas/FacilityStatus" }
        metadata: { $ref: "#/components/schemas/FacilityMetadata" }
    FacilityEquipmentAssignment:
      type: object
      required: [id, equipoId, salaId, asignadoEn, finalizadoEn, notas, asignadoPorUsuarioId]
      properties:
        id: { type: string, format: uuid }
        equipoId: { type: string, format: uuid }
        salaId: { type: string, format: uuid }
        asignadoEn: { type: string, format: date-time }
        finalizadoEn: { type: string, format: date-time, nullable: true }
        notas: { type: string, nullable: true }
        asignadoPorUsuarioId: { type: string, format: uuid, nullable: true }
    FacilityMaintenance:
      type: object
      required:
        [
          id,
          equipoId,
          tipo,
          estado,
          programadoPara,
          iniciadoEn,
          completadoEn,
          proveedor,
          tecnico,
          descripcion,
          hallazgos,
          resolucion,
          costo,
          moneda,
        ]
      properties:
        id: { type: string, format: uuid }
        equipoId: { type: string, format: uuid }
        tipo: { $ref: "#/components/schemas/FacilityMaintenanceType" }
        estado: { $ref: "#/components/schemas/FacilityMaintenanceStatus" }
        programadoPara: { type: string, format: date }
        iniciadoEn: { type: string, format: date-time, nullable: true }
        completadoEn: { type: string, format: date-time, nullable: true }
        proveedor: { type: string, nullable: true }
        tecnico: { type: string, nullable: true }
        descripcion: { type: string }
        hallazgos: { type: string, nullable: true }
        resolucion: { type: string, nullable: true }
        costo: { type: number, nullable: true }
        moneda: { type: string, nullable: true }

    # --- Envelopes de éxito ---
    FacilityBranchEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/FacilityBranch" }
    FacilityBranchPageEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: object
              required: [items, page, pageSize, total, totalPages]
              properties:
                items:
                  type: array
                  items: { $ref: "#/components/schemas/FacilityBranch" }
                page: { type: integer, minimum: 1 }
                pageSize: { type: integer, minimum: 1, maximum: 100 }
                total: { type: integer, minimum: 0 }
                totalPages: { type: integer, minimum: 0 }
    FacilityRoomEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/FacilityRoom" }
    FacilityRoomPageEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: object
              required: [items, page, pageSize, total, totalPages]
              properties:
                items:
                  type: array
                  items: { $ref: "#/components/schemas/FacilityRoom" }
                page: { type: integer, minimum: 1 }
                pageSize: { type: integer, minimum: 1, maximum: 100 }
                total: { type: integer, minimum: 0 }
                totalPages: { type: integer, minimum: 0 }
    FacilityAccessPointEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/FacilityAccessPoint" }
    FacilityAccessPointListEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/FacilityAccessPoint" }
    FacilityEquipmentAssignmentEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/FacilityEquipmentAssignment" }
    FacilityMaintenanceEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/FacilityMaintenance" }
    FacilityMaintenancePageEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: object
              required: [items, page, pageSize, total, totalPages]
              properties:
                items:
                  type: array
                  items: { $ref: "#/components/schemas/FacilityMaintenance" }
                page: { type: integer, minimum: 1 }
                pageSize: { type: integer, minimum: 1, maximum: 100 }
                total: { type: integer, minimum: 0 }
                totalPages: { type: integer, minimum: 0 }
    # ==== training ====
    RoutineVisibility:
      type: string
      enum: [PRIVATE, SHARED, TEMPLATE]
    RoutineStatus:
      type: string
      enum: [ACTIVE, ARCHIVED]
    RoutineAssignmentStatus:
      type: string
      enum: [ACTIVE, COMPLETED, CANCELLED]
    RoutineGoal:
      type: string
      enum: [HIPERTROFIA, FUERZA, RESISTENCIA, PERDIDA_GRASA, SALUD_GENERAL, REHABILITACION]
    RoutineExerciseCreateRequest:
      type: object
      required: [orden]
      additionalProperties: false
      description: >-
        Ejercicio prescrito. Debe incluir "ejercicioId" o "ejercicioNombre" (al menos uno).
        Si se envían "repsMin" y "repsMax", "repsMax" debe ser >= "repsMin".
      properties:
        ejercicioId: { type: string, format: uuid }
        ejercicioNombre: { type: string, minLength: 1, maxLength: 160 }
        orden: { type: integer, minimum: 1, maximum: 500 }
        seriesObjetivo: { type: integer, minimum: 1, maximum: 100, default: 3 }
        repsMin: { type: integer, nullable: true, minimum: 1, maximum: 1000 }
        repsMax: { type: integer, nullable: true, minimum: 1, maximum: 1000 }
        pesoObjetivoKg: { type: number, nullable: true, minimum: 0, maximum: 2000 }
        rirObjetivo: { type: integer, nullable: true, minimum: 0, maximum: 10 }
        descansoSeg: { type: integer, nullable: true, minimum: 0, maximum: 7200 }
        nota: { type: string, nullable: true, maxLength: 1000 }
    RoutineExerciseUpdateRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      description: >-
        Debe enviar al menos un campo. Si se envían "repsMin" y "repsMax", "repsMax" debe ser >= "repsMin".
      properties:
        orden: { type: integer, minimum: 1, maximum: 500 }
        seriesObjetivo: { type: integer, minimum: 1, maximum: 100 }
        repsMin: { type: integer, nullable: true, minimum: 1, maximum: 1000 }
        repsMax: { type: integer, nullable: true, minimum: 1, maximum: 1000 }
        pesoObjetivoKg: { type: number, nullable: true, minimum: 0, maximum: 2000 }
        rirObjetivo: { type: integer, nullable: true, minimum: 0, maximum: 10 }
        descansoSeg: { type: integer, nullable: true, minimum: 0, maximum: 7200 }
        nota: { type: string, nullable: true, maxLength: 1000 }
    RoutineCreateRequest:
      type: object
      required: [nombre]
      additionalProperties: false
      properties:
        nombre: { type: string, minLength: 2, maxLength: 160 }
        descripcion: { type: string, nullable: true, maxLength: 4000 }
        visibilidad:
          allOf:
            - $ref: "#/components/schemas/RoutineVisibility"
          default: PRIVATE
        objetivo:
          oneOf:
            - $ref: "#/components/schemas/RoutineGoal"
          nullable: true
    RoutineUpdateRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      description: Debe enviar al menos un campo para actualizar.
      properties:
        nombre: { type: string, minLength: 2, maxLength: 160 }
        descripcion: { type: string, nullable: true, maxLength: 4000 }
        visibilidad: { $ref: "#/components/schemas/RoutineVisibility" }
        objetivo:
          oneOf:
            - $ref: "#/components/schemas/RoutineGoal"
          nullable: true
        estado: { $ref: "#/components/schemas/RoutineStatus" }
    RoutineAssignRequest:
      type: object
      required: [clienteUsuarioId]
      additionalProperties: false
      properties:
        clienteUsuarioId: { type: string, format: uuid }
        fechaProgramada:
          type: string
          format: date
          nullable: true
          pattern: '^\d{4}-\d{2}-\d{2}$'
        diasSemana:
          type: array
          maxItems: 7
          default: []
          items: { type: integer, minimum: 0, maximum: 6 }
          description: Días de la semana (0=domingo .. 6=sábado). Se deduplican y ordenan.
        nota: { type: string, nullable: true, maxLength: 1000 }
    RoutineImportItem:
      type: object
      required: [nombre, ejercicios]
      additionalProperties: false
      properties:
        nombre: { type: string, minLength: 2, maxLength: 160 }
        descripcion: { type: string, nullable: true, maxLength: 4000 }
        visibilidad:
          allOf:
            - $ref: "#/components/schemas/RoutineVisibility"
          default: PRIVATE
        objetivo:
          oneOf:
            - $ref: "#/components/schemas/RoutineGoal"
          nullable: true
        ejercicios:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: "#/components/schemas/RoutineExerciseCreateRequest" }
    RoutineImportRequest:
      type: object
      required: [rutinas]
      additionalProperties: false
      properties:
        rutinas:
          type: array
          minItems: 1
          maxItems: 200
          items: { $ref: "#/components/schemas/RoutineImportItem" }
    RoutineExerciseResponse:
      type: object
      additionalProperties: true
      required: [id, orden, seriesObjetivo, ejercicio]
      properties:
        id: { type: string, format: uuid }
        orden: { type: integer }
        seriesObjetivo: { type: integer }
        repsMin: { type: integer, nullable: true }
        repsMax: { type: integer, nullable: true }
        pesoObjetivoKg: { type: number, nullable: true }
        rirObjetivo: { type: integer, nullable: true }
        descansoSeg: { type: integer, nullable: true }
        nota: { type: string, nullable: true }
        ejercicio:
          type: object
          nullable: true
          additionalProperties: true
          description: Ejercicio de catálogo asociado (forma de Exercise) o null.
    RoutineResponse:
      type: object
      additionalProperties: true
      required:
        [id, nombre, creadoPorUsuarioId, visibilidad, estado, ejercicios, fechaCreacion, fechaActualizacion]
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string }
        descripcion: { type: string, nullable: true }
        creadoPorUsuarioId: { type: string, format: uuid }
        visibilidad: { $ref: "#/components/schemas/RoutineVisibility" }
        objetivo:
          oneOf:
            - $ref: "#/components/schemas/RoutineGoal"
          nullable: true
        estado: { $ref: "#/components/schemas/RoutineStatus" }
        ejercicios:
          type: array
          items: { $ref: "#/components/schemas/RoutineExerciseResponse" }
        fechaCreacion: { type: string, format: date-time }
        fechaActualizacion: { type: string, format: date-time }
    RoutineAssignmentResponse:
      type: object
      additionalProperties: true
      required:
        [id, rutinaId, clienteUsuarioId, asignadoPorUsuarioId, estado, diasSemana, fechaCreacion]
      properties:
        id: { type: string, format: uuid }
        rutinaId: { type: string, format: uuid }
        clienteUsuarioId: { type: string, format: uuid }
        asignadoPorUsuarioId: { type: string, format: uuid }
        estado: { $ref: "#/components/schemas/RoutineAssignmentStatus" }
        fechaProgramada: { type: string, format: date, nullable: true }
        diasSemana:
          type: array
          items: { type: integer, minimum: 0, maximum: 6 }
        nota: { type: string, nullable: true }
        clienteNombre: { type: string, nullable: true }
        clienteEmail: { type: string, format: email, nullable: true }
        rutina:
          oneOf:
            - $ref: "#/components/schemas/RoutineResponse"
          nullable: true
        fechaCreacion: { type: string, format: date-time }
    RoutineImportResultItem:
      type: object
      required: [index, nombre, creada, routineId, error]
      properties:
        index: { type: integer, minimum: 0 }
        nombre: { type: string }
        creada: { type: boolean }
        routineId: { type: string, format: uuid, nullable: true }
        error: { type: string, nullable: true }
    RoutineEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/RoutineResponse" }
    RoutinePageEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: object
              required: [items, page, pageSize, total, totalPages]
              properties:
                items:
                  type: array
                  items: { $ref: "#/components/schemas/RoutineResponse" }
                page: { type: integer, minimum: 1 }
                pageSize: { type: integer, minimum: 1, maximum: 100 }
                total: { type: integer, minimum: 0 }
                totalPages: { type: integer, minimum: 0 }
    RoutineAssignmentEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/RoutineAssignmentResponse" }
    RoutineAssignmentListEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/RoutineAssignmentResponse" }
    RoutineDeleteEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: object
              required: [deleted]
              properties:
                deleted: { type: boolean, enum: [true] }
    RoutineImportEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: object
              required: [resultados, creadas]
              properties:
                resultados:
                  type: array
                  items: { $ref: "#/components/schemas/RoutineImportResultItem" }
                creadas: { type: integer, minimum: 0 }
    RoutineStartedSessionEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: object
              additionalProperties: true
              required: [id, estado]
              description: Sesión de entrenamiento creada (forma de Workout).
              properties:
                id: { type: string, format: uuid }
                estado: { type: string, enum: [EN_PROGRESO, FINALIZADA, CANCELADA] }
    # ==== notifications ====
    NotificationChannel:
      type: string
      enum: [IN_APP, HTTP_GATEWAY, MOCK]
    NotificationStatus:
      type: string
      enum: [PENDING, SENT, FAILED, DEAD_LETTER, READ]
    Notification:
      type: object
      required: [id, canal, mensaje, estado, creadoEn]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        membresiaId: { type: string, format: uuid, nullable: true }
        canal: { $ref: "#/components/schemas/NotificationChannel" }
        asunto: { type: string, nullable: true }
        mensaje: { type: string }
        diasRestantes: { type: integer, nullable: true }
        estado: { $ref: "#/components/schemas/NotificationStatus" }
        leidoEn: { type: string, format: date-time, nullable: true }
        enviadoEn: { type: string, format: date-time, nullable: true }
        creadoEn: { type: string, format: date-time }
    NotificationPreference:
      type: object
      required:
        - recordatoriosVencimiento
        - canalPreferido
        - consentimientoExternoEn
        - versionConsentimiento
        - horaSilencioInicio
        - horaSilencioFin
      additionalProperties: false
      properties:
        recordatoriosVencimiento: { type: boolean }
        canalPreferido:
          type: string
          enum: [IN_APP, HTTP_GATEWAY]
        consentimientoExternoEn: { type: string, format: date-time, nullable: true }
        versionConsentimiento: { type: string, nullable: true }
        horaSilencioInicio:
          type: string
          nullable: true
          pattern: "^([01]\\d|2[0-3]):[0-5]\\d(:[0-5]\\d)?$"
        horaSilencioFin:
          type: string
          nullable: true
          pattern: "^([01]\\d|2[0-3]):[0-5]\\d(:[0-5]\\d)?$"
    UpdateNotificationPreferenceRequest:
      type: object
      required: [recordatoriosVencimiento, canalPreferido]
      additionalProperties: false
      properties:
        recordatoriosVencimiento: { type: boolean }
        canalPreferido:
          type: string
          enum: [IN_APP, HTTP_GATEWAY]
        consentimientoExternoEn:
          type: string
          format: date-time
          nullable: true
        versionConsentimiento:
          type: string
          minLength: 1
          maxLength: 80
          nullable: true
        horaSilencioInicio:
          type: string
          nullable: true
          pattern: "^([01]\\d|2[0-3]):[0-5]\\d(:[0-5]\\d)?$"
        horaSilencioFin:
          type: string
          nullable: true
          pattern: "^([01]\\d|2[0-3]):[0-5]\\d(:[0-5]\\d)?$"
        metadata:
          type: object
          additionalProperties: true
          default: {}
          description: El JSON serializado no puede superar 4 KiB.
    NotificationEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/Notification" }
    NotificationPreferenceEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/NotificationPreference" }
    NotificationPageEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: object
              required: [items, page, pageSize, total, totalPages]
              properties:
                items:
                  type: array
                  items: { $ref: "#/components/schemas/Notification" }
                page: { type: integer, minimum: 1 }
                pageSize: { type: integer, minimum: 1, maximum: 100 }
                total: { type: integer, minimum: 0 }
                totalPages: { type: integer, minimum: 0 }
                fechaNegocio:
                  type: string
                  format: date
                  description: Fecha de negocio con la que se calcularon los días restantes.
    # ==== membership-admin ====
    MembershipAdminPlanType:
      type: string
      enum: [DAY_PASS, WEEKLY, MONTHLY, QUARTERLY, SEMIANNUAL, ANNUAL, CUSTOM]
    MembershipAdminPlanStatus:
      type: string
      enum: [ACTIVE, INACTIVE]
    MembershipAdminMembershipStatus:
      type: string
      enum: [ACTIVE, SUSPENDED, CANCELLED, EXPIRED]
    MembershipAdminEntitlementSource:
      type: string
      enum: [MEMBERSHIP, PURCHASE, ADMIN_GRANT, PROMOTION, TRIAL]
    MembershipAdminStaffPosition:
      type: string
      enum: [COACH, FRONT_DESK, ADMINISTRATION]
    MembershipAdminEmploymentStatus:
      type: string
      enum: [ACTIVE, SUSPENDED, TERMINATED]
    MembershipAdminScopeInput:
      type: object
      additionalProperties: false
      required: [sedeId]
      properties:
        sedeId: { type: string, format: uuid }
        salaId: { type: string, format: uuid, nullable: true }
    MembershipAdminScope:
      type: object
      additionalProperties: true
      required: [sedeId, salaId]
      properties:
        sedeId: { type: string, format: uuid }
        salaId: { type: string, format: uuid, nullable: true }
    MembershipAdminCreatePlanRequest:
      type: object
      additionalProperties: false
      required: [codigo, nombre, tipo, duracionDias, alcances]
      properties:
        codigo:
          type: string
          minLength: 2
          maxLength: 80
          pattern: "^[A-Za-z0-9._-]+$"
        nombre: { type: string, minLength: 2, maxLength: 180 }
        descripcion: { type: string, nullable: true, maxLength: 2000 }
        tipo: { $ref: "#/components/schemas/MembershipAdminPlanType" }
        duracionDias: { type: integer, minimum: 1, maximum: 3650 }
        diasRecordatorio:
          type: array
          maxItems: 30
          default: [7, 3, 1, 0]
          items: { type: integer, minimum: 0, maximum: 3650 }
        alcances:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: "#/components/schemas/MembershipAdminScopeInput" }
        metadata:
          type: object
          description: El JSON serializado no puede superar 16 KiB.
          additionalProperties: true
          default: {}
    MembershipAdminUpdatePlanRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        nombre: { type: string, minLength: 2, maxLength: 180 }
        descripcion: { type: string, nullable: true, maxLength: 2000 }
        tipo: { $ref: "#/components/schemas/MembershipAdminPlanType" }
        duracionDias: { type: integer, minimum: 1, maximum: 3650 }
        diasRecordatorio:
          type: array
          maxItems: 30
          items: { type: integer, minimum: 0, maximum: 3650 }
        estado: { $ref: "#/components/schemas/MembershipAdminPlanStatus" }
        metadata:
          type: object
          additionalProperties: true
    MembershipAdminReplaceScopesRequest:
      type: object
      additionalProperties: false
      required: [alcances]
      properties:
        alcances:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: "#/components/schemas/MembershipAdminScopeInput" }
    MembershipAdminCreateCustomerRequest:
      type: object
      additionalProperties: false
      required: [email, password, pinAcceso, nombreCompleto, numeroCliente]
      properties:
        email: { type: string, format: email, maxLength: 180 }
        password: { type: string, minLength: 10, maxLength: 128, format: password }
        pinAcceso: { type: string, pattern: "^\\d{4,12}$" }
        nombreCompleto: { type: string, minLength: 3, maxLength: 180 }
        numeroCliente: { type: string, minLength: 2, maxLength: 80 }
        telefono: { type: string, nullable: true, minLength: 5, maxLength: 40 }
        referenciaExterna: { type: string, nullable: true, minLength: 1, maxLength: 180 }
        notas: { type: string, nullable: true, maxLength: 2000 }
        metadata:
          type: object
          additionalProperties: true
          default: {}
    MembershipAdminCreateMembershipRequest:
      type: object
      additionalProperties: false
      required: [clienteUsuarioId, planId]
      properties:
        clienteUsuarioId: { type: string, format: uuid }
        planId: { type: string, format: uuid }
        iniciaEl: { type: string, format: date }
        referenciaExterna: { type: string, nullable: true, minLength: 1, maxLength: 180 }
        notas: { type: string, nullable: true, maxLength: 2000 }
        metadata:
          type: object
          additionalProperties: true
          default: {}
    MembershipAdminMembershipStatusRequest:
      type: object
      additionalProperties: false
      required: [estado]
      properties:
        estado: { $ref: "#/components/schemas/MembershipAdminMembershipStatus" }
        motivo: { type: string, nullable: true, maxLength: 2000 }
    MembershipAdminCreateStaffRequest:
      type: object
      additionalProperties: false
      required: [usuarioId, cargo, contratadoEl, sedes]
      properties:
        usuarioId: { type: string, format: uuid }
        cargo: { $ref: "#/components/schemas/MembershipAdminStaffPosition" }
        contratadoEl: { type: string, format: date }
        accesoIlimitado: { type: boolean, default: true }
        sedes:
          type: array
          minItems: 1
          maxItems: 100
          items: { type: string, format: uuid }
        metadata:
          type: object
          additionalProperties: true
          default: {}
    MembershipAdminUpdateStaffStatusRequest:
      type: object
      additionalProperties: false
      required: [estadoLaboral]
      properties:
        estadoLaboral: { $ref: "#/components/schemas/MembershipAdminEmploymentStatus" }
        terminadoEl: { type: string, format: date, nullable: true }
    MembershipAdminPlanImage:
      type: object
      additionalProperties: true
      properties:
        id: { type: string, format: uuid }
        publicId: { type: string }
        url: { type: string, nullable: true }
        altText: { type: string, nullable: true }
        width: { type: integer, nullable: true }
        height: { type: integer, nullable: true }
        licencia: { type: string, nullable: true }
        atribucion: { type: string, nullable: true }
    MembershipAdminPlan:
      type: object
      additionalProperties: true
      required: [id, codigo, nombre, tipo, duracionDias, estado, alcances]
      properties:
        id: { type: string, format: uuid }
        publicId: { type: string }
        codigo: { type: string }
        nombre: { type: string }
        descripcion: { type: string, nullable: true }
        tipo: { $ref: "#/components/schemas/MembershipAdminPlanType" }
        duracionDias: { type: integer }
        diasRecordatorio:
          type: array
          items: { type: integer }
        estado: { $ref: "#/components/schemas/MembershipAdminPlanStatus" }
        precio: { type: number, nullable: true }
        moneda: { type: string, nullable: true }
        beneficios:
          type: array
          items: { type: object, additionalProperties: true }
        orden: { type: integer }
        disponibleNuevo: { type: boolean }
        disponibleRenovacion: { type: boolean }
        disponibleExtension: { type: boolean }
        imagen:
          allOf:
            - $ref: "#/components/schemas/MembershipAdminPlanImage"
          nullable: true
        alcances:
          type: array
          items: { $ref: "#/components/schemas/MembershipAdminScope" }
        metadata:
          type: object
          additionalProperties: true
    MembershipAdminMembership:
      type: object
      additionalProperties: true
      required: [id, clienteUsuarioId, planId, iniciaEl, venceEl, estado, diasRestantes]
      properties:
        id: { type: string, format: uuid }
        clienteUsuarioId: { type: string, format: uuid }
        planId: { type: string, format: uuid }
        plan: { $ref: "#/components/schemas/MembershipAdminPlan" }
        iniciaEl: { type: string, format: date }
        venceEl: { type: string, format: date }
        estado: { $ref: "#/components/schemas/MembershipAdminMembershipStatus" }
        diasRestantes: { type: integer, minimum: 0 }
        venceHoy: { type: boolean }
        vigenteHoy: { type: boolean }
        referenciaExterna: { type: string, nullable: true }
        notas: { type: string, nullable: true }
    MembershipAdminCustomerUser:
      type: object
      additionalProperties: true
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        nombreCompleto: { type: string }
        estado: { type: string }
    MembershipAdminCustomer:
      type: object
      additionalProperties: true
      required: [id, usuarioId, numeroCliente]
      properties:
        id: { type: string, format: uuid }
        usuarioId: { type: string, format: uuid }
        numeroCliente: { type: string }
        telefono: { type: string, nullable: true }
        registradoEl: { type: string, format: date }
        referenciaExterna: { type: string, nullable: true }
        notas: { type: string, nullable: true }
        usuario: { $ref: "#/components/schemas/MembershipAdminCustomerUser" }
    MembershipAdminStaff:
      type: object
      additionalProperties: true
      required: [id, usuarioId, cargo, estadoLaboral, contratadoEl, accesoIlimitado, sedes]
      properties:
        id: { type: string, format: uuid }
        usuarioId: { type: string, format: uuid }
        cargo: { $ref: "#/components/schemas/MembershipAdminStaffPosition" }
        estadoLaboral: { $ref: "#/components/schemas/MembershipAdminEmploymentStatus" }
        contratadoEl: { type: string, format: date }
        terminadoEl: { type: string, format: date, nullable: true }
        accesoIlimitado: { type: boolean }
        sedes:
          type: array
          items: { type: string, format: uuid }
    MembershipAdminPlanEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/MembershipAdminPlan" }
    MembershipAdminPlanListEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/MembershipAdminPlan" }
    MembershipAdminMembershipEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/MembershipAdminMembership" }
    MembershipAdminMembershipPageEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: object
              required: [items, page, pageSize, total, totalPages]
              properties:
                items:
                  type: array
                  items: { $ref: "#/components/schemas/MembershipAdminMembership" }
                page: { type: integer, minimum: 1 }
                pageSize: { type: integer, minimum: 1, maximum: 100 }
                total: { type: integer, minimum: 0 }
                totalPages: { type: integer, minimum: 0 }
    MembershipAdminCustomerEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/MembershipAdminCustomer" }
    MembershipAdminCustomerPageEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: object
              required: [items, page, pageSize, total, totalPages]
              properties:
                items:
                  type: array
                  items: { $ref: "#/components/schemas/MembershipAdminCustomer" }
                page: { type: integer, minimum: 1 }
                pageSize: { type: integer, minimum: 1, maximum: 100 }
                total: { type: integer, minimum: 0 }
                totalPages: { type: integer, minimum: 0 }
    MembershipAdminStaffEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/MembershipAdminStaff" }
