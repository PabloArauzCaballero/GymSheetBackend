##
## Local and single-host deployment stack.
##
## Startup order is enforced, not assumed: PostgreSQL and Redis must report
## healthy, then `migrate` runs to completion, and only then do the API and
## workers start. Without that gate an instance can serve traffic against a
## schema older than its own code.
##
## Secrets arrive from the environment (see .env.example); none are defaulted to
## a usable value, so a missing variable fails fast instead of starting with a
## known-weak credential.
##

x-app-image: &app-image
  image: gym-sheet-backend:local

x-app-environment: &app-environment
  NODE_ENV: ${NODE_ENV:-production}
  API_PREFIX: ${API_PREFIX:-api/v1}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  BUSINESS_TIME_ZONE: ${BUSINESS_TIME_ZONE:-America/La_Paz}
  ACCESS_POLICY_VERSION: ${ACCESS_POLICY_VERSION:-2026-07-19}
  WHATSAPP_MEMBERSHIP_PHONE: ${WHATSAPP_MEMBERSHIP_PHONE:?WHATSAPP_MEMBERSHIP_PHONE is required}
  SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
  SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
  SEED_ADMIN_FULL_NAME: ${SEED_ADMIN_FULL_NAME:-GymSheet Administrator}
  SEED_MOCK_PASSWORD: ${SEED_MOCK_PASSWORD:-}
  # Forzado a false en runtime Docker: las imágenes de ejercicios ya están
  # espejadas en almacenamiento local (yarn db:media:mirror). Reactivar el
  # refresco volvería a apuntar exercise_media.url a raw.githubusercontent. Para
  # reimportar el catálogo desde cero, ponlo temporalmente en "true".
  EXERCISES_DATASET_ENABLED: "false"
  EXERCISES_DATASET_JSON_URL: ${EXERCISES_DATASET_JSON_URL:-https://raw.githubusercontent.com/hasaneyldrm/exercises-dataset/main/data/exercises.json}
  EXERCISES_DATASET_ALLOWED_HOSTS: ${EXERCISES_DATASET_ALLOWED_HOSTS:-raw.githubusercontent.com}
  EXERCISES_DATASET_TIMEOUT_MS: ${EXERCISES_DATASET_TIMEOUT_MS:-15000}
  EXERCISES_DATASET_MAX_RESPONSE_BYTES: ${EXERCISES_DATASET_MAX_RESPONSE_BYTES:-25000000}
  EXERCISES_DATASET_BATCH_SIZE: ${EXERCISES_DATASET_BATCH_SIZE:-100}
  EXERCISES_DATASET_MIN_RECORDS: ${EXERCISES_DATASET_MIN_RECORDS:-1000}
  EXERCISES_DATASET_REFRESH_INTERVAL_MS: ${EXERCISES_DATASET_REFRESH_INTERVAL_MS:-86400000}
  EXERCISES_DATASET_REFRESH_RETRY_MS: ${EXERCISES_DATASET_REFRESH_RETRY_MS:-3600000}
  EXERCISES_DATASET_IMPORT_MEDIA: ${EXERCISES_DATASET_IMPORT_MEDIA:-false}
  EXERCISES_DATASET_MEDIA_LICENSE_CONFIRMED: ${EXERCISES_DATASET_MEDIA_LICENSE_CONFIRMED:-false}
  EXERCISES_OPEN_MEDIA_ENABLED: ${EXERCISES_OPEN_MEDIA_ENABLED:-true}
  EXERCISES_OPEN_MEDIA_JSON_URL: ${EXERCISES_OPEN_MEDIA_JSON_URL:-https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/dist/exercises.json}
  EXERCISES_OPEN_MEDIA_BASE_URL: ${EXERCISES_OPEN_MEDIA_BASE_URL:-https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/}
  # Canonical exercises source at boot (ADR-0006, option b). `github` requires
  # EXERCISES_DATASET_ENABLED=true; the app fails fast otherwise (no silent fallback).
  CANONICAL_EXERCISES_SOURCE: ${CANONICAL_EXERCISES_SOURCE:-seeders}

  # Media storage (ports & adapters). `local` writes to the media-data volume the
  # api service mounts at /app/storage/media and serves under the public base URL.
  # Switch to cloudinary/s3 by implementing the adapter and setting the provider.
  MEDIA_STORAGE_PROVIDER: ${MEDIA_STORAGE_PROVIDER:-local}
  MEDIA_STORAGE_LOCAL_ROOT: ${MEDIA_STORAGE_LOCAL_ROOT:-/app/storage/media}
  MEDIA_STORAGE_PUBLIC_BASE_URL: ${MEDIA_STORAGE_PUBLIC_BASE_URL:-http://localhost:3001/media}
  MEDIA_UPLOAD_MAX_BYTES: ${MEDIA_UPLOAD_MAX_BYTES:-5242880}
  MEDIA_ALLOWED_MIME: ${MEDIA_ALLOWED_MIME:-image/jpeg,image/png,image/webp,image/gif}
  # `db:media:mirror` copies external media into local storage (forces JPEG/PNG).
  MEDIA_MIRROR_ALLOWED_HOSTS: ${MEDIA_MIRROR_ALLOWED_HOSTS:-images.unsplash.com,raw.githubusercontent.com}
  MEDIA_MIRROR_TIMEOUT_MS: ${MEDIA_MIRROR_TIMEOUT_MS:-15000}
  # Purga de stories caducadas (worker-stories-purge). Borra la fila siempre y
  # el binario solo cuando ninguna otra fila lo referencia (el nombre de fichero
  # es el SHA-256 del contenido, así que se comparte entre usuarios).
  STORIES_PURGE_INTERVAL_MS: ${STORIES_PURGE_INTERVAL_MS:-3600000}
  STORIES_PURGE_BATCH_SIZE: ${STORIES_PURGE_BATCH_SIZE:-200}
  CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
  CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
  CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
  CLOUDINARY_FOLDER: ${CLOUDINARY_FOLDER:-gymsheet}

  # Defaults to the compose-network `postgres` service; set DB_HOST/DB_PORT in
  # .env to point every container (api, migrate, workers) at an external
  # database (e.g. Neon) instead, without touching this file.
  DB_HOST: ${DB_HOST:-postgres}
  DB_PORT: ${DB_PORT:-5432}
  DB_NAME: ${DB_NAME:?DB_NAME is required}
  DB_USER: ${DB_USER:?DB_USER is required}
  DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
  DB_SSL: ${DB_SSL:-false}
  DB_SSL_REJECT_UNAUTHORIZED: ${DB_SSL_REJECT_UNAUTHORIZED:-true}
  DB_POOL_MAX: ${DB_POOL_MAX:-10}
  DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS:-15000}

  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
  JWT_ISSUER: ${JWT_ISSUER:-gym-sheet-api}
  JWT_AUDIENCE: ${JWT_AUDIENCE:-gym-sheet-web}

  # Gimnasio de referencia para una instalación de una sola marca; sin esto
  # las cuentas creadas sin tenantId explícito se quedan sin marca.
  DEFAULT_TENANT_ID: ${DEFAULT_TENANT_ID:-}
  PASSWORD_RESET_TOKEN_TTL: ${PASSWORD_RESET_TOKEN_TTL:-10m}
  PASSWORD_RESET_MAX_ATTEMPTS: ${PASSWORD_RESET_MAX_ATTEMPTS:-5}
  # Solo para desarrollo local: nunca en producción (env.ts lo rechaza si
  # NODE_ENV=production).
  PASSWORD_RESET_DEV_LOG_ENABLED: ${PASSWORD_RESET_DEV_LOG_ENABLED:-false}

  # Shared rate-limit counters. Required here because this stack can scale the
  # api service beyond one replica.
  REDIS_URL: redis://redis:6379
  REDIS_REQUIRED: "true"

  METRICS_SCRAPE_TOKEN: ${METRICS_SCRAPE_TOKEN:-}
  # 3002 (puerto de la web): el socket de chat lo abre el navegador directo
  # contra este backend, no a través del BFF, así que necesita CORS propio.
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3002}
  TRUST_PROXY: ${TRUST_PROXY:-false}
  RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-100}
  AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-10}
  PUBLIC_RATE_LIMIT_MAX: ${PUBLIC_RATE_LIMIT_MAX:-60}

x-worker-runtime: &worker-runtime
  # The image ships an HTTP liveness probe for the API. Workers serve no HTTP,
  # so that probe can never pass and would leave them permanently `unhealthy`,
  # tripping alerts and blocking orchestrator rollouts. Liveness for a worker is
  # process liveness, which the restart policy already covers.
  healthcheck:
    disable: true

x-app-security: &app-security
  # No process in these containers needs to escalate privileges or write to its
  # own filesystem.
  security_opt:
    - no-new-privileges:true
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:?DB_NAME is required}
      POSTGRES_USER: ${DB_USER:?DB_USER is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    ports:
      # 5433, not 5432: a native Postgres install already owns 5432 on this
      # machine. Host access here is for local tooling (seed scripts, a GUI
      # client) only — the other services reach this container over the
      # compose network by service name and never touch this mapping.
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Applied only when the data directory is empty, i.e. on first creation.
      # Subsequent schema changes belong to the migrate service.
      - ./docs/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"
        reservations:
          memory: 256m
          cpus: "0.25"

  redis:
    image: redis:7-alpine
    # Persistence is deliberately off: this instance holds only rate-limit
    # counters, which are safe to lose and cheap to rebuild.
    command:
      [
        "redis-server",
        "--save",
        "",
        "--appendonly",
        "no",
        "--maxmemory",
        "256mb",
        "--maxmemory-policy",
        "allkeys-lru",
      ]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 320m
          cpus: "0.5"
        reservations:
          memory: 64m

  migrate:
    <<: *app-image
    command: ["node", "dist/database/migrate.js", "up"]
    environment:
      <<: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
    # One-shot: compose treats a non-zero exit as a failed dependency, so the
    # API never starts against a half-migrated schema.
    restart: "no"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777

  api:
    <<: [*app-image, *app-security]
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      <<: *app-environment
      PORT: 3000
    # Writable media root for the local storage adapter, mounted over the
    # read-only root filesystem. On a single host this volume can be shared by
    # multiple api replicas; across hosts, use a remote provider (Cloudinary/S3)
    # instead of local storage.
    volumes:
      - media-data:/app/storage/media
    # A fixed host port can only be bound by one replica, so `--scale api=N`
    # fails while this mapping is present. To run several replicas, remove it
    # and front the service with a reverse proxy on the compose network; the
    # shared Redis already makes rate limiting correct across replicas.
    ports:
      # Keep local Node development on :3000; Docker publishes the API on :3001.
      - "${API_PORT:-3001}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1.0"
        reservations:
          memory: 256m
          cpus: "0.25"
    # SIGTERM is forwarded by tini and handled by enableShutdownHooks(); allow
    # in-flight requests to drain before the container is killed.
    stop_grace_period: 30s

  worker-access:
    <<: [*app-image, *app-security, *worker-runtime]
    command: ["node", "dist/workers/access-event.worker.js"]
    environment:
      <<: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 384m
    # Longer than the API: a worker must be allowed to finish the job it holds
    # rather than leave it locked until the lock timeout expires.
    stop_grace_period: 45s

  worker-reminders:
    <<: [*app-image, *app-security, *worker-runtime]
    command: ["node", "dist/workers/membership-reminder.worker.js"]
    environment:
      <<: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 384m
          cpus: "0.5"
        reservations:
          memory: 128m
    stop_grace_period: 45s

  worker-notifications:
    <<: [*app-image, *app-security, *worker-runtime]
    command: ["node", "dist/workers/notification-delivery.worker.js"]
    environment:
      <<: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 384m
          cpus: "0.5"
        reservations:
          memory: 128m
    stop_grace_period: 45s

  worker-exercises-dataset:
    <<: [*app-image, *app-security, *worker-runtime]
    command: ["node", "dist/workers/exercises-dataset-refresh.worker.js"]
    environment:
      <<: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1.0"
        reservations:
          memory: 192m
    stop_grace_period: 45s

  worker-stories-purge:
    <<: [*app-image, *app-security, *worker-runtime]
    command: ["node", "dist/workers/stories-purge.worker.js"]
    environment:
      <<: *app-environment
    # Unlike the other workers this one deletes binaries, so it needs the same
    # media volume the api writes to. Mounted over the read-only root
    # filesystem, exactly as in the api service.
    volumes:
      - media-data:/app/storage/media
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 384m
          cpus: "0.5"
        reservations:
          memory: 128m
    stop_grace_period: 45s

volumes:
  postgres-data:
  # Uploaded media for MEDIA_STORAGE_PROVIDER=local; persists across restarts.
  media-data:
